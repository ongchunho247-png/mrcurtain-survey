    // Migration: key 'blue' cũ → 'green' mới
    function normalizeThemeKey(key) {
      if (key === 'blue') return 'green';
      if (THEMES[key]) return key;
      return 'white';
    }
    function applyTheme(bgColor) {
      const key   = normalizeThemeKey(bgColor);
      const theme = THEMES[key];
      Object.entries(theme).forEach(([k, v]) => document.documentElement.style.setProperty(k, v));
      // Cập nhật meta theme-color theo primary của theme
      const metaTC = document.getElementById('meta-theme-color');
      if (metaTC) metaTC.setAttribute('content', theme['--primary']);
    }

    // --- Logger có cấu trúc (in ra console theo format log template) ---
    function storageLog(level, screen, action, description, detail = null) {
      const ts = new Date().toLocaleString('vi-VN');
      const entry = [
        `[${level}] ${ts}`,
        `  Màn hình      : ${screen}`,
        `  Lệnh đã chạy  : ${action}`,
        `  Mô tả         : ${description}`,
        detail ? `  Chi tiết       : ${detail}` : null,
        `  Key IDB: ${STORAGE_KEY}`,
      ].filter(Boolean).join('\n');
      if (level === 'ERROR') console.error(entry);
      else console.info(entry);
    }

    /**
     * Chuyển error thành chuỗi đọc được — tránh in [object Object].
     * Xử lý cả Error instance và plain object {type, message}.
     */
    function formatError(err) {
      if (!err) return 'undefined';
      if (typeof err === 'string') return err;
      if (err instanceof Error) {
        return err.stack ? `${err.message}\n${err.stack}` : err.message;
      }
      // Plain object (ví dụ: {type:'QUOTA', message:'...'})
      try { return JSON.stringify(err); } catch { return String(err); }
    }

    function generateId() {
      return 'proj_' + Date.now() + '_' + Math.random().toString(36).slice(2, 9);
    }

    // --- Migration: chuyển dữ liệu từ key cũ sang key mới (chạy 1 lần) ---
    function migrateFromLegacyKey() {
      try {
        const legacy = _lsGet(STORAGE_KEY_LEGACY);
        const current = _lsGet(STORAGE_KEY);
        if (legacy && !current) {
          _lsSet(STORAGE_KEY, legacy);
          _lsRemove(STORAGE_KEY_LEGACY);
          storageLog('INFO', 'khởi động', 'migrateFromLegacyKey()',
            `Đã migrate ${JSON.parse(legacy).length} công trình từ key cũ sang key mới`);
        }
      } catch (err) {
        storageLog('ERROR', 'khởi động', 'migrateFromLegacyKey()',
          'Lỗi migrate key cũ', String(err));
      }
    }

    // migrateFromLegacyKey() now runs inside initStorage()

    /* ═══════════════════════════════════════════════════════════════════════
       PROMPT 14.2 — HỆ THỐNG BẢO VỆ DỮ LIỆU localStorage KHI CẬP NHẬT APP
       ═══════════════════════════════════════════════════════════════════════
       Nguyên tắc:
         - KHÔNG bao giờ clear() / removeItem() dữ liệu thật
         - Chỉ bổ sung field còn thiếu, KHÔNG ghi đè dữ liệu có sẵn
         - Backup toàn bộ trước khi chạy bất kỳ migration nào
         - Dùng DATA_VERSION để biết version hiện tại đang lưu
    ═══════════════════════════════════════════════════════════════════════ */

    /** Version dữ liệu hiện tại của app.
     *  Tăng số này khi cần thêm field mới vào project / image / tag. */
    const DATA_VERSION     = '1.2';
    const VERSION_KEY      = 'mrcurtain_survey_data_version';
    const BACKUP_KEY_PREFIX = 'mrcurtain_survey_backup_before_migration_';

    /* ── Tạo backup toàn bộ dữ liệu quan trọng ─────────────────────────── */
    function backupBeforeMigration() {
      try {
        const ts      = new Date().toISOString().replace(/[:.]/g, '-');
        const backupKey = BACKUP_KEY_PREFIX + ts;
        const backup  = {
          backedUpAt:   new Date().toISOString(),
          dataVersion:  _lsGet(VERSION_KEY) || 'unknown',
          projects:     _lsGet(STORAGE_KEY),
          images:       _lsGet(IMAGES_KEY),
          tags:         _lsGet(TAGS_KEY),
          currentView:  _lsGet(VIEW_KEY),
        };
        _lsSet(backupKey, JSON.stringify(backup));
        storageLog('INFO', 'khởi động', 'backupBeforeMigration()',
          'Đã backup dữ liệu trước migration', `backupKey: ${backupKey}`);
        /* Dọn backup cũ hơn 5 bản để không tốn bộ nhớ */
        try {
          const backupKeys = _lsKeys().filter(k => k.startsWith(BACKUP_KEY_PREFIX));
          backupKeys.sort(); // sắp xếp theo timestamp (ISO string → sort = thứ tự thời gian)
          while (backupKeys.length > 5) {
            _lsRemove(backupKeys.shift()); // xóa bản cũ nhất
          }
        } catch (_) { /* không quan trọng */ }
        return backupKey;
      } catch (err) {
        storageLog('WARN', 'khởi động', 'backupBeforeMigration()',
          'Không thể tạo backup (có thể bộ nhớ đầy)', formatError(err));
        return null; // không backup được nhưng KHÔNG chặn migration
      }
    }

    /* ── Migration v1.0 → v1.1: bổ sung contactPerson/contactPhone cho project ─ */
    function migrateProjects_v1_1(projects) {
      let changed = false;
      const result = projects.map(p => {
        const patch = {};
        if (p.contactPerson === undefined) { patch.contactPerson = ''; changed = true; }
        if (p.contactPhone  === undefined) { patch.contactPhone  = ''; changed = true; }
        return Object.keys(patch).length ? { ...p, ...patch } : p;
      });
      return { data: result, changed };
    }

    /* ── Migration v1.1 → v1.2: bổ sung field mảng cho images ─────────── */
    function migrateImages_v1_2(images) {
      let changed = false;
      const result = images.map(img => {
        const patch = {};
        /* positions[] ← position (backward compat) */
        if (!Array.isArray(img.positions)) {
          patch.positions = img.position ? [img.position] : [];
          changed = true;
        }
        /* curtainTypes[] ← curtainType */
        if (!Array.isArray(img.curtainTypes)) {
          patch.curtainTypes = img.curtainType ? [img.curtainType] : [];
          changed = true;
        }
        /* productSpecs[] ← productSpec */
        if (!Array.isArray(img.productSpecs)) {
          patch.productSpecs = img.productSpec ? [img.productSpec] : [];
          changed = true;
        }
        /* status mặc định */
        if (img.status === undefined) {
          patch.status = 'survey';
          changed = true;
        }
        /* isDeleted mặc định */
        if (img.isDeleted === undefined) {
          patch.isDeleted = false;
          changed = true;
        }
        return Object.keys(patch).length ? { ...img, ...patch } : img;
      });
      return { data: result, changed };
    }

    /* ── Hàm chính: chạy toàn bộ migration cần thiết ────────────────────── */
    function runDataMigration() {
      try {
        const currentVersion = _lsGet(VERSION_KEY);

        /* Đã đúng version → không làm gì */
        if (currentVersion === DATA_VERSION) return;

        storageLog('INFO', 'khởi động', 'runDataMigration()',
          `Phát hiện cần migration`,
          `version hiện tại: ${currentVersion || 'chưa có'} → mục tiêu: ${DATA_VERSION}`);

        /* Backup trước khi làm bất cứ điều gì */
        backupBeforeMigration();

        let projectsMigrated = false;
        let imagesMigrated   = false;

        /* ── Migrate projects ── */
        try {
          const rawProjects = _lsGet(STORAGE_KEY);
          if (rawProjects) {
            const parsed = JSON.parse(rawProjects);
            if (Array.isArray(parsed) && parsed.length > 0) {
              const { data: migrated, changed } = migrateProjects_v1_1(parsed);
              if (changed) {
                _lsSet(STORAGE_KEY, JSON.stringify(migrated));
                storageLog('INFO', 'khởi động', 'runDataMigration()',
                  `Đã migrate ${parsed.length} công trình (bổ sung field mới)`);
                projectsMigrated = true;
              }
            }
          }
        } catch (err) {
          storageLog('ERROR', 'khởi động', 'runDataMigration()',
            'Lỗi migrate projects — giữ nguyên dữ liệu cũ', formatError(err));
          /* KHÔNG ghi đè dữ liệu cũ nếu lỗi */
        }

        /* ── Migrate images ── */
        try {
          const rawImages = _lsGet(IMAGES_KEY);
          if (rawImages) {
            const parsed = JSON.parse(rawImages);
            if (Array.isArray(parsed) && parsed.length > 0) {
              const { data: migrated, changed } = migrateImages_v1_2(parsed);
              if (changed) {
                _lsSet(IMAGES_KEY, JSON.stringify(migrated));
                storageLog('INFO', 'khởi động', 'runDataMigration()',
                  `Đã migrate ${parsed.length} ảnh (bổ sung field mới)`);
                imagesMigrated = true;
              }
            }
          }
        } catch (err) {
          storageLog('ERROR', 'khởi động', 'runDataMigration()',
            'Lỗi migrate images — giữ nguyên dữ liệu cũ', formatError(err));
        }

        /* ── Lưu version mới sau khi migrate thành công ── */
        _lsSet(VERSION_KEY, DATA_VERSION);
        storageLog('INFO', 'khởi động', 'runDataMigration()',
          `Migration hoàn tất`,
          `version: ${DATA_VERSION} | projects: ${projectsMigrated} | images: ${imagesMigrated}`);

      } catch (err) {
        /* Lỗi không mong đợi — KHÔNG làm gì thêm, giữ nguyên toàn bộ dữ liệu */
        storageLog('ERROR', 'khởi động', 'runDataMigration()',
          'Lỗi nghiêm trọng khi migration — dữ liệu cũ được giữ nguyên', formatError(err));
      }
    }

    /* runDataMigration() now runs inside initStorage() */

    /**
     * Đọc danh sách công trình từ localStorage.
     * Trả về [] nếu chưa có dữ liệu hoặc dữ liệu bị lỗi — app không crash.
     */
    function getProjects() {
      try {
        const raw = _lsGet(STORAGE_KEY);
        if (!raw) return [];                          // Chưa có dữ liệu → OK
        const parsed = JSON.parse(raw);               // Có thể throw nếu JSON lỗi
        if (!Array.isArray(parsed)) {
          storageLog('ERROR', 'danh-sách', 'getProjects()',
            'Dữ liệu localStorage không phải Array, reset về []',
            `Kiểu dữ liệu: ${typeof parsed}`);
          return [];
        }
        return parsed.filter(p => p.isDeleted !== true).sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
      } catch (err) {
        storageLog('ERROR', 'danh-sách', 'getProjects()',
          'JSON.parse thất bại — dữ liệu localStorage bị hỏng, trả về []',
          String(err));
        return [];                                    // App không crash
      }
    }

    /**
     * Lưu toàn bộ mảng projects vào localStorage.
     */
    function saveProjects(projects) {
      try {
        if (!Array.isArray(projects)) throw new Error('projects phải là Array');
        _lsSet(STORAGE_KEY, JSON.stringify(projects));
      } catch (err) {
        storageLog('ERROR', 'lưu-dữ-liệu', 'saveProjects()',
          'Lỗi ghi localStorage', String(err));
        throw err; // ném lên để component xử lý
      }
    }

    /**
     * Thêm một công trình mới vào localStorage + trả về object đã lưu.
     */
    function addProject(data) {
      const projects = getProjects();
      const now = new Date().toISOString();
      const project = {
        projectId:     generateId(),
        projectName:   data.projectName   || '',
        customerName:  data.customerName  || '',
        contactPerson: data.contactPerson || '',
        contactPhone:  data.contactPhone  || '',
        address:       data.address       || '',
        surveyPerson:  data.surveyPerson  || '',
        department:    data.department    || 'sale',
        surveyDate:    data.surveyDate    || '',
        generalNote:   data.generalNote   || '',
        imageCount:    0,
        createdAt:     now,
        updatedAt:     now,
      };
      saveProjects([project, ...projects]);
      storageLog('INFO', 'tạo-công-trình', 'addProject()',
        `Đã lưu công trình "${project.projectName}"`, `projectId: ${project.projectId}`);
      return project;
    }

    /**
     * Cập nhật một công trình đã có theo projectId.
     * Chỉ ghi đè các trường trong `updates`, giữ nguyên phần còn lại.
     * Lưu lại vào localStorage key mrcurtain_survey_projects.
     */
    function updateProject(projectId, updates) {
      try {
        const projects = getProjects();
        const idx = projects.findIndex(p => p.projectId === projectId);
        if (idx === -1) {
          storageLog('ERROR', 'storage', 'updateProject()',
            'Không tìm thấy project để cập nhật',
            `projectId: ${projectId}`);
          return null;
        }
        const updated = {
          ...projects[idx],
          ...updates,
          projectId,                            // bảo vệ ID không bị ghi đè
          updatedAt: new Date().toISOString(),
        };
        projects[idx] = updated;
        saveProjects(projects);
        return updated;
      } catch (err) {
        storageLog('ERROR', 'storage', 'updateProject()',
          'Lỗi cập nhật project',
          err instanceof Error ? err.message : JSON.stringify(err));
        throw err;
      }
    }

    // Alias giữ tương thích với code cũ trong form
    const saveProject = addProject;

    /** XÓA MỀM công trình: isDeleted = true */
    function softDeleteProject(projectId) {
      try {
        var projects = getProjects().concat(getDeletedProjects());
        var idx = projects.findIndex(function(p) { return p.projectId === projectId; });
        if (idx === -1) return null;
        projects[idx] = Object.assign({}, projects[idx], { isDeleted: true, deletedAt: new Date().toISOString(), updatedAt: new Date().toISOString() });
        _lsSet(STORAGE_KEY, JSON.stringify(projects));
        window.dispatchEvent(new Event('projectsUpdated'));
        storageLog('INFO', 'danh-sách', 'softDeleteProject()', 'Xóa mềm công trình', 'projectId: ' + projectId);
        return projects[idx];
      } catch(err) {
        storageLog('ERROR', 'danh-sách', 'softDeleteProject()', 'Lỗi xóa mềm', String(err));
        throw err;
      }
    }

    /** KHÔI PHỤC công trình từ thùng rác */
    function restoreProject(projectId) {
      try {
        var raw = _lsGet(STORAGE_KEY);
        var all = raw ? JSON.parse(raw) : [];
        var idx = all.findIndex(function(p) { return p.projectId === projectId; });
        if (idx === -1) return null;
        all[idx] = Object.assign({}, all[idx], { isDeleted: false, deletedAt: null, updatedAt: new Date().toISOString() });
        _lsSet(STORAGE_KEY, JSON.stringify(all));
        window.dispatchEvent(new Event('projectsUpdated'));
        storageLog('INFO', 'thùng-rác', 'restoreProject()', 'Khôi phục công trình', 'projectId: ' + projectId);
        return all[idx];
      } catch(err) {
        storageLog('ERROR', 'thùng-rác', 'restoreProject()', 'Lỗi khôi phục', String(err));
        throw err;
      }
    }

    /** XÓA VĨNH VIỄN công trình và toàn bộ ảnh của nó */
    function permanentDeleteProject(projectId) {
      try {
        var raw = _lsGet(STORAGE_KEY);
        var all = raw ? JSON.parse(raw) : [];
        var filtered = all.filter(function(p) { return p.projectId !== projectId; });
        _lsSet(STORAGE_KEY, JSON.stringify(filtered));
        // Xóa luôn tất cả ảnh của project
        var rawImgs = _lsGet(IMAGES_KEY);
        if (rawImgs) {
          var imgs = JSON.parse(rawImgs);
          _lsSet(IMAGES_KEY, JSON.stringify(imgs.filter(function(img) { return img.projectId !== projectId; })));
        }
        window.dispatchEvent(new Event('projectsUpdated'));
        storageLog('INFO', 'thùng-rác', 'permanentDeleteProject()', 'Xóa vĩnh viễn công trình', 'projectId: ' + projectId);
      } catch(err) {
        storageLog('ERROR', 'thùng-rác', 'permanentDeleteProject()', 'Lỗi xóa vĩnh viễn', String(err));
        throw err;
      }
    }

    /** Lấy danh sách công trình đã xóa mềm */
    function getDeletedProjects() {
      try {
        var raw = _lsGet(STORAGE_KEY);
        if (!raw) return [];
        var all = JSON.parse(raw);
        if (!Array.isArray(all)) return [];
        return all
          .filter(function(p) { return p.isDeleted === true; })
          .sort(function(a, b) { return new Date(b.deletedAt || b.updatedAt) - new Date(a.deletedAt || a.updatedAt); });
      } catch(err) { return []; }
    }

    // =============================================
    // IMAGE STORAGE UTILS  (Prompt 5)
    // =============================================
    /**
     * Lấy tất cả ảnh của một công trình.
     * Trả về [] nếu không có hoặc lỗi — app không crash.
     */
    /**
     * Lấy danh sách ảnh ACTIVE (chưa xóa) của công trình.
     * Ảnh khôi phục (có restoredAt) sắp xếp cuối danh sách.
     * Ảnh cũ chưa có field isDeleted → coi là chưa xóa.
     */
    function getImages(projectId) {
      try {
        const raw = _lsGet(IMAGES_KEY);
        if (!raw) return [];
        const all = JSON.parse(raw);
        if (!Array.isArray(all)) return [];
        return all
          .filter(img => img.projectId === projectId && img.isDeleted !== true)
          .sort((a, b) => {
            const aR = !!a.restoredAt, bR = !!b.restoredAt;
            if (aR !== bR) return aR ? 1 : -1;            // restored → cuối
            if (aR && bR) return new Date(a.restoredAt) - new Date(b.restoredAt);
            return new Date(b.createdAt) - new Date(a.createdAt); // mới nhất trước
          });
      } catch (err) {
        storageLog('ERROR', 'chi-tiết', 'getImages()',
          'JSON.parse images thất bại', String(err));
        return [];
      }
    }

    /**
     * Lấy danh sách ảnh ĐÃ XÓA MỀM (isDeleted === true) của công trình.
     */
    function getDeletedImages(projectId) {
      try {
        const raw = _lsGet(IMAGES_KEY);
        if (!raw) return [];
        const all = JSON.parse(raw);
        if (!Array.isArray(all)) return [];
        return all
          .filter(img => img.projectId === projectId && img.isDeleted === true)
          .sort((a, b) => new Date(b.deletedAt || b.createdAt) - new Date(a.deletedAt || a.createdAt));
      } catch (err) {
        storageLog('ERROR', 'chi-tiết', 'getDeletedImages()',
          'Lỗi đọc ảnh đã xóa', formatError(err));
        return [];
      }
    }

    /**
     * Tính tiến độ / trạng thái công trình từ ảnh active (Prompt 10).
     * Chỉ tính ảnh có isDeleted !== true.
     * Trả về: { totalActiveImages, surveyImages, productionImages, projectGroup }
     * projectGroup: "surveying" | "readyForProduction"
     */
    function getProjectProgress(projectId) {
      try {
        const activeImages = getImages(projectId); // đã lọc isDeleted !== true
        const total = activeImages.length;
        const production = activeImages.filter(img => img.status === 'production').length;
        const survey = total - production; // status === 'survey' hoặc chưa có status → coi là khảo sát
        const group = (total > 0 && survey === 0) ? 'readyForProduction' : 'surveying';
        return {
          totalActiveImages: total,
          surveyImages:      survey,
          productionImages:  production,
          projectGroup:      group,
        };
      } catch (err) {
        storageLog('ERROR', 'list', 'getProjectProgress()',
          'Lỗi tính trạng thái công trình', formatError(err));
        return { totalActiveImages: 0, surveyImages: 0, productionImages: 0, projectGroup: 'surveying' };
      }
    }

    /**
     * XÓA MỀM: đánh isDeleted = true, không xóa object khỏi localStorage.
     */
    function softDeleteImage(imageId, projectId) {
      try {
        const now = new Date().toISOString();
        const updated = updateImageInfo(imageId, { isDeleted: true, deletedAt: now });
        if (!updated) throw new Error(`Không tìm thấy imageId: ${imageId}`);
        // Cập nhật imageCount — chỉ đếm ảnh active
        if (projectId) {
          const cnt = getImages(projectId).length;
          updateProject(projectId, { imageCount: cnt });
          window.dispatchEvent(new Event('projectsUpdated'));

        storageLog('INFO', 'chi-tiết', 'softDeleteImage()',
          `Xóa mềm imageId: ${imageId}`, `projectId: ${projectId}`);
        return updated;
      } catch (err) {
        storageLog('ERROR', 'chi-tiết', 'softDeleteImage()',
          'Lỗi xóa mềm', formatError(err));

    /**

        const updated = updateImageInfo(imageId, {
          isDeleted:  false,

          restoredAt: now,

        if (!updated) throw new Error(`Không tìm thấy imageId: ${imageId}`);

    /**
     * XÓA VĨNH VIỄN: remove hẳn object ảnh khỏi localStorage.

    function permanentDeleteImage(imageId) {

    /**
     * Lưu một ảnh mới vào localStorage.
     * @param {Object} data - { projectId, imagePreviewUrl, ... }
     * @returns {Object} ảnh đã lưu
     */
    function addImage(data) {
      try {
        const raw = _lsGet(IMAGES_KEY);
        const all = raw ? JSON.parse(raw) : [];
        if (!Array.isArray(all)) throw new Error('Images store không phải Array');

        const now = new Date().toISOString();
        const image = {
          imageId:         'img_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7),
          projectId:       data.projectId,
          imagePreviewUrl: data.imagePreviewUrl,
          // Các trường chuẩn bị cho Prompt 6+
          position:   '',
          area:       '',
          curtainType:'',
          productSpec:'',
          usageSpec:  '',
          width:      '',
          height:     '',
          unit:       'cm',
          notes:      '',
          tags:       [],
          createdAt:  now,
          updatedAt:  now,
        };

        _lsSet(IMAGES_KEY, JSON.stringify([...all, image]));

        // Cập nhật imageCount trên project
        const projects = getProjects();
        const proj = projects.find(p => p.projectId === data.projectId);
        if (proj) {
          const cnt = getImages(data.projectId).length; // đọc lại sau khi đã lưu
          updateProject(data.projectId, { imageCount: cnt });
          window.dispatchEvent(new Event('projectsUpdated'));
        }

        storageLog('INFO', 'chi-tiết', 'addImage()',
          `Đã lưu ảnh cho project ${data.projectId}`, `imageId: ${image.imageId}`);
        return image;
      } catch (err) {
        // Kiểm tra lỗi quota
        const isQuota = err instanceof DOMException &&
          (err.code === 22 || err.name === 'QuotaExceededError' || err.name === 'NS_ERROR_DOM_QUOTA_REACHED');
        storageLog('ERROR', 'chi-tiết', 'addImage()',
          isQuota ? 'localStorage đã đầy (QuotaExceededError)' : 'Lỗi lưu ảnh',
          formatError(err));
        throw isQuota
          ? { type: 'QUOTA', message: 'Bộ nhớ trình duyệt đã đầy. Vui lòng xóa bớt ảnh cũ hoặc xóa cache.' }
          : { type: 'SAVE_ERROR', message: 'Lỗi lưu ảnh. Vui lòng thử lại.' };
      }
    }

    /**

    function deleteImage(imageId, projectId) {

        if (!raw) return;
        const all = JSON.parse(raw);

        throw err;

    }

    /**
     * Nén ảnh bằng Canvas API trước khi lưu base64.
     * maxWidth: giới hạn chiều rộng (px)
     * quality: 0–1 (JPEG quality)
     */
    function compressImage(file, maxWidth = 900, quality = 0.72) {
      return new Promise((resolve, reject) => {
        // Kiểm tra file type
        if (!file.type.startsWith('image/')) {
          reject(new Error('File không phải ảnh'));
          return;
        }

        const objectUrl = URL.createObjectURL(file);
        const img = new Image();

        img.onload = () => {
          try {
            let w = img.naturalWidth;
            let h = img.naturalHeight;

            // Scale down nếu quá lớn
            if (w > maxWidth) {
              h = Math.round(h * maxWidth / w);
              w = maxWidth;
            }
            // Giới hạn chiều cao cũng tối đa 1200px
            const maxHeight = 1200;
            if (h > maxHeight) {
              w = Math.round(w * maxHeight / h);
              h = maxHeight;
            }

            const canvas = document.createElement('canvas');
            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, w, h);

            URL.revokeObjectURL(objectUrl);
            resolve(canvas.toDataURL('image/jpeg', quality));
          } catch (e) {
            URL.revokeObjectURL(objectUrl);
            reject(e);
          }
        };

        img.onerror = (e) => {
          URL.revokeObjectURL(objectUrl);
          reject(new Error('Không đọc được file ảnh'));
        };

        img.src = objectUrl;
      });
    }

    /**
     * Cập nhật thông tin (hashtag, kích thước, ghi chú) cho một ảnh.
     * Tìm đúng imageId, merge updates, ghi lại vào IMAGES_KEY.
     */
    function updateImageInfo(imageId, updates) {
      try {
        const raw = _lsGet(IMAGES_KEY);
        if (!raw) {
          storageLog('ERROR', 'image-detail', 'updateImageInfo()',
            'IMAGES_KEY rỗng, không tìm thấy ảnh', `imageId: ${imageId}`);
          return null;
        }
        const all = JSON.parse(raw);
        if (!Array.isArray(all)) throw new Error('Images store không phải Array');

        const idx = all.findIndex(img => img.imageId === imageId);
        if (idx === -1) {
          storageLog('ERROR', 'image-detail', 'updateImageInfo()',
            'Không tìm thấy imageId', `imageId: ${imageId}`);
          return null;
        }
        const updated = {
          ...all[idx],
          ...updates,
          imageId,                              // bảo vệ ID không bị ghi đè
          updatedAt: new Date().toISOString(),
        };
        all[idx] = updated;
        _lsSet(IMAGES_KEY, JSON.stringify(all));

        storageLog('INFO', 'image-detail', 'updateImageInfo()',
          `Đã cập nhật thông tin ảnh`, `imageId: ${imageId}`);
        return updated;
      } catch (err) {
        storageLog('ERROR', 'image-detail', 'updateImageInfo()',
          'Lỗi cập nhật thông tin ảnh',
          err instanceof Error ? `${err.message}\n${err.stack}` : JSON.stringify(err));

    /**
     * Tạo danh sách tag mặc định từ HASHTAG_GROUPS.
     * Mỗi option trong mỗi group → 1 tag object.
     */
    function buildDefaultTags() {
      const tags = [];
      let counter = 0;
      HASHTAG_GROUPS.forEach(group => {
        group.options.forEach((name, idx) => {
          tags.push({
            tagId:     `tag_default_${group.id}_${idx}`,
            tagGroup:  group.id,
            tagName:   name,
            sortOrder: idx,
            isActive:  true,
            createdAt: new Date().toISOString(),
            updatedAt: new Date().toISOString(),
          });
          counter++;
        });
      });
      return tags;
    }

    /**
     * Migration: bổ sung tag mặc định cho các nhóm chưa có trong localStorage.
     * Không xóa hay sửa tag cũ. Chỉ thêm nhóm hoàn toàn mới.
     * Trả về mảng tags đã được bổ sung (hoặc nguyên bản nếu không cần).
     */
    function seedMissingGroups(existing) {
      let changed = false;
      let result = [...existing];
      const now = new Date().toISOString();
      HASHTAG_GROUPS.forEach(group => {
        const hasGroup = result.some(t => t.tagGroup === group.id);
        if (!hasGroup && Array.isArray(group.options)) {
          group.options.forEach((name, idx) => {
            result.push({
              tagId:     `tag_default_${group.id}_${idx}`,
              tagGroup:  group.id,
              tagName:   name,
              sortOrder: idx,
              isActive:  true,
              createdAt: now,
              updatedAt: now,
            });
          });
          changed = true;
          storageLog('INFO', 'tag-manager', 'seedMissingGroups()',
            `Đã seed nhóm mới: ${group.label}`, `Số tag: ${group.options.length}`);
        }
      });
      return changed ? result : existing;
    }

    /**
     * Lấy tất cả tag từ localStorage.
     * Nếu chưa có → khởi tạo từ buildDefaultTags().
     * Nếu có nhưng thiếu nhóm mới → seed nhóm mới (migration).
     */
    function getTags() {
      try {
        const raw = _lsGet(TAGS_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (Array.isArray(parsed) && parsed.length > 0) {
            // Migration: bổ sung nhóm mới nếu localStorage cũ chưa có
            const migrated = seedMissingGroups(parsed);
            if (migrated !== parsed) {
              _lsSet(TAGS_KEY, JSON.stringify(migrated));
            }
            return migrated;
          }
        }
        // Khởi tạo lần đầu
        const defaults = buildDefaultTags();
        _lsSet(TAGS_KEY, JSON.stringify(defaults));
        storageLog('INFO', 'tag-manager', 'getTags()',
          'Khởi tạo tag mặc định', `Tổng: ${defaults.length} tags`);
        return defaults;
      } catch (err) {
        storageLog('ERROR', 'tag-manager', 'getTags()',
          'Lỗi đọc TAGS_KEY', formatError(err));
        return buildDefaultTags();
      }
    }

    /**
     * Lấy tag đang active theo groupId, sắp xếp theo sortOrder.
     * Dùng trong ImageDetail để render chip options.
     */
    function getTagsByGroup(groupId) {
      try {
        const all = getTags();
        return all
          .filter(t => t.tagGroup === groupId && t.isActive)
          .sort((a, b) => a.sortOrder - b.sortOrder);
      } catch (err) {
        storageLog('ERROR', 'tag-manager', 'getTagsByGroup()',
          'Lỗi lọc tag theo group', formatError(err));
        return [];
      }
    }

    /**
     * Lưu toàn bộ mảng tags về localStorage.
     */
    function saveTags(tags) {
      try {
        _lsSet(TAGS_KEY, JSON.stringify(tags));
      } catch (err) {
        storageLog('ERROR', 'tag-manager', 'saveTags()',
          'Lỗi lưu tags', formatError(err));
        throw err;
      }
    }

    /**
     * Thêm tag mới vào một group.
     * Validate: tagName không rỗng, không trùng (case-insensitive) trong cùng group.
     * Trả về tag đã tạo hoặc throws { type, message }.
     */
    function addTag(groupId, tagName) {
      const name = (tagName || '').trim();
      if (!name) throw { type: 'VALIDATION', message: 'Tên thẻ không được để trống.' };
      if (name.length > 40) throw { type: 'VALIDATION', message: 'Tên thẻ tối đa 40 ký tự.' };

      const all = getTags();
      const duplicate = all.find(
        t => t.tagGroup === groupId && t.tagName.toLowerCase() === name.toLowerCase()
      );
      if (duplicate) {
        if (!duplicate.isActive) {
          throw { type: 'DUPLICATE_HIDDEN', message: `Thẻ "${name}" đã tồn tại nhưng đang bị ẩn. Bạn có thể hiện lại thẻ đó.` };
        }
        throw { type: 'DUPLICATE', message: `Thẻ "${name}" đã tồn tại trong nhóm này.` };
      }

      const maxOrder = all
        .filter(t => t.tagGroup === groupId)
        .reduce((max, t) => Math.max(max, t.sortOrder), -1);

      const newTag = {
        tagId:     `tag_${Date.now()}_${Math.random().toString(36).slice(2,7)}`,
        tagGroup:  groupId,
        tagName:   name,
        sortOrder: maxOrder + 1,
        isActive:  true,
        createdAt: new Date().toISOString(),
        updatedAt: new Date().toISOString(),
      };
      all.push(newTag);
      saveTags(all);
      storageLog('INFO', 'tag-manager', 'addTag()',
        `Đã thêm tag mới: "${name}"`, `group: ${groupId}, tagId: ${newTag.tagId}`);
      return newTag;
    }

    /**
     * Cập nhật tagName hoặc sortOrder của một tag.
     * Validate tên không rỗng và không trùng với tag khác trong group.
     */
    function updateTag(tagId, updates) {
      const all = getTags();
      const idx = all.findIndex(t => t.tagId === tagId);
      if (idx === -1) throw { type: 'NOT_FOUND', message: 'Không tìm thấy thẻ.' };

      const current = all[idx];
      if (updates.tagName !== undefined) {
        const name = (updates.tagName || '').trim();
        if (!name) throw { type: 'VALIDATION', message: 'Tên thẻ không được để trống.' };
        if (name.length > 40) throw { type: 'VALIDATION', message: 'Tên thẻ tối đa 40 ký tự.' };
        const duplicate = all.find(
          t => t.tagId !== tagId &&
               t.tagGroup === current.tagGroup &&
               t.tagName.toLowerCase() === name.toLowerCase()
        );
        if (duplicate) throw { type: 'DUPLICATE', message: `Thẻ "${name}" đã tồn tại trong nhóm này.` };
        updates.tagName = name;
      }

      all[idx] = { ...current, ...updates, tagId, updatedAt: new Date().toISOString() };
      saveTags(all);
      storageLog('INFO', 'tag-manager', 'updateTag()',
        `Đã cập nhật tag`, `tagId: ${tagId}`);
      return all[idx];
    }

    /**
     * Ẩn một tag (isActive: false). Tag vẫn còn trong localStorage.
     */
    function hideTag(tagId) {
      const all = getTags();
      const idx = all.findIndex(t => t.tagId === tagId);
      if (idx === -1) throw { type: 'NOT_FOUND', message: 'Không tìm thấy thẻ.' };
      all[idx] = { ...all[idx], isActive: false, updatedAt: new Date().toISOString() };
      saveTags(all);
      storageLog('INFO', 'tag-manager', 'hideTag()',
        `Đã ẩn tag`, `tagId: ${tagId}, name: ${all[idx].tagName}`);
    }

    /**
     * Hiện lại một tag đã ẩn (isActive: true).
     */
    function showTag(tagId) {
      const all = getTags();
      const idx = all.findIndex(t => t.tagId === tagId);
      if (idx === -1) throw { type: 'NOT_FOUND', message: 'Không tìm thấy thẻ.' };
      all[idx] = { ...all[idx], isActive: true, updatedAt: new Date().toISOString() };
      saveTags(all);
      storageLog('INFO', 'tag-manager', 'showTag()',
        `Đã hiện lại tag`, `tagId: ${tagId}, name: ${all[idx].tagName}`);
    }

    /**
     * Sắp xếp lại thứ tự các tag active trong một nhóm.
     * @param {string} groupId - id của nhóm (HASHTAG_GROUPS.id)
     * @param {string[]} orderedTagIds - mảng tagId theo thứ tự mới
     */
    function reorderTagsInGroup(groupId, orderedTagIds) {
      try {
        const all = getTags();
        const now = new Date().toISOString();
        orderedTagIds.forEach((tagId, newIdx) => {
          const i = all.findIndex(t => t.tagId === tagId);
          if (i !== -1 && all[i].sortOrder !== newIdx) {
            all[i] = { ...all[i], sortOrder: newIdx, updatedAt: now };
          }
        });
        saveTags(all);
        storageLog('INFO', 'tag-manager', 'reorderTagsInGroup()',
          `Đã sắp xếp lại thứ tự nhóm ${groupId}`,
          `Thứ tự mới: ${orderedTagIds.join(', ')}`);
      } catch (err) {
        storageLog('ERROR', 'tag-manager', 'reorderTagsInGroup()',
          'Lỗi sắp xếp thứ tự tag', formatError(err));
        throw err;
      }
    }

    /**
     * Xóa hẳn một tag khỏi localStorage (chỉ dùng cho tag đã ẩn).
     * Không xóa dữ liệu đã gắn trên image object.
     */
    function permanentDeleteTag(tagId) {
      try {
        const all = getTags();
        const idx = all.findIndex(t => t.tagId === tagId);
        if (idx === -1) throw { type: 'NOT_FOUND', message: 'Không tìm thấy thẻ.' };
        const tag = all[idx];
        if (tag.isActive) throw { type: 'ACTIVE_TAG', message: 'Chỉ có thể xóa bỏ thẻ đang ẩn.' };
        const updated = all.filter(t => t.tagId !== tagId);
        saveTags(updated);
        storageLog('INFO', 'tag-manager', 'permanentDeleteTag()',
          `Đã xóa bỏ tag vĩnh viễn`, `tagId: ${tagId}, name: ${tag.tagName}, group: ${tag.tagGroup}`);
      } catch (err) {
        storageLog('ERROR', 'tag-manager', 'permanentDeleteTag()',
          'Lỗi xóa bỏ tag', formatError(err));
        throw err;
      }
    }

    // =============================================
    // NAVIGATION PERSISTENCE  (Prompt 8)
    // =============================================

    /**
     * Lưu trạng thái màn hình hiện tại vào localStorage.
     * @param {'projectList'|'projectDetail'|'imageDetail'} view
     * @param {string|null} projectId
     * @param {string|null} imageId
     */
    function saveCurrentView(view, projectId = null, imageId = null) {
      try {
        const data = {
          currentView:      view,
          currentProjectId: projectId || null,
          currentImageId:   imageId   || null,
          updatedAt:        new Date().toISOString(),
        };
        _lsSet(VIEW_KEY, JSON.stringify(data));
      } catch (err) {
        // Lỗi ghi localStorage không được crash app
        storageLog('ERROR', 'navigation', 'saveCurrentView()',
          'Không thể lưu trạng thái màn hình', formatError(err));
      }
    }

    /**
     * Đọc và xác thực trạng thái màn hình từ localStorage.
     * Trả về { screen, selectedProjectId, selectedImageId } để khởi tạo App.
     * Nếu dữ liệu lỗi hoặc projectId/imageId không còn tồn tại → về 'list'.
     */
    function restoreCurrentView() {
      const defaultState = { screen: 'list', selectedProjectId: null, selectedImageId: null };
      try {
        const raw = _lsGet(VIEW_KEY);
        if (!raw) return defaultState;
        const saved = JSON.parse(raw);
        if (!saved || !saved.currentView) return defaultState;

        const { currentView, currentProjectId, currentImageId } = saved;

        if (currentView === 'projectDetail' || currentView === 'imageDetail') {
          if (!currentProjectId) return defaultState;
          // Kiểm tra project còn tồn tại
          const projects = getProjects();
          const projectExists = projects.some(p => p.projectId === currentProjectId);
          if (!projectExists) return defaultState;

          if (currentView === 'imageDetail') {
            if (!currentImageId) {
              return { screen: 'detail', selectedProjectId: currentProjectId, selectedImageId: null };
            }
            // Kiểm tra image còn tồn tại
            const img = getImageById(currentImageId);
            if (!img || img.projectId !== currentProjectId) {
              return { screen: 'detail', selectedProjectId: currentProjectId, selectedImageId: null };
            }
            return { screen: 'image-detail', selectedProjectId: currentProjectId, selectedImageId: currentImageId };
          }

          return { screen: 'detail', selectedProjectId: currentProjectId, selectedImageId: null };
        }

        // projectList hoặc giá trị lạ → về list
        return defaultState;
      } catch (err) {
        storageLog('ERROR', 'navigation', 'restoreCurrentView()',
          'Lỗi đọc trạng thái màn hình — về danh sách', formatError(err));
        return defaultState;
      }
    }

    // =============================================
    // HELPERS
    // =============================================
    function formatDate(str) {
      if (!str) return '—';
      if (/^\d{4}-\d{2}-\d{2}$/.test(str)) {
        const [y, m, d] = str.split('-');
        return `${d}/${m}/${y}`;
      }
      try {
        return new Date(str).toLocaleDateString('vi-VN', { day: '2-digit', month: '2-digit', year: 'numeric' });
      } catch { return str; }
    }

    /* ── Helpers xuất báo cáo (Prompt 12) ── */
    function escapeHtml(s) {
      return String(s == null ? '' : s)
        .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }
    function joinLines(str) {
      if (!str) return '';
      return str.split('\n').map(function(s){return s.trim();}).filter(Boolean).join(' • ');
    }
    /* Backward compat: ưu tiên mảng mới, fallback field cũ */
    function getPositionDisplay(img) {
      if (Array.isArray(img.positions) && img.positions.length > 0) return img.positions.join(' - ');
      return img.position || 'Chưa có';
    }
    function getCurtainTypesDisplay(img) {
      if (Array.isArray(img.curtainTypes) && img.curtainTypes.length > 0) return img.curtainTypes.join(', ');
      return img.curtainType || 'Chưa có';
    }
    function getProductSpecsDisplay(img) {
      if (Array.isArray(img.productSpecs) && img.productSpecs.length > 0) return img.productSpecs.join(', ');
      return img.productSpec || 'Chưa có';
    }
    function getSizeDisplay(img) {
      if (img.width && img.height) return `${img.width} × ${img.height} ${img.unit || 'mm'}`;
      return 'Chưa có kích thước';
    }
    function sanitizeFileName(s) {
      return String(s || '').replace(/[\/\\:*?"<>|]/g, '-').trim().slice(0, 60);
    }
    function buildReportFileName(project, ext) {
      const today = new Date().toISOString().slice(0, 10);
      const name  = sanitizeFileName(project.projectName || 'Không tên');
      return `Báo cáo khảo sát - ${name} - ${today}.${ext}`;
    }
    function buildImageFileName(stt, img) {
      const pos = (Array.isArray(img.positions) && img.positions.length > 0)
        ? img.positions.join(' - ')
        : (img.position || 'Chưa có vị trí');
      return `${stt} - ${sanitizeFileName(pos)}.png`;
    }
    /* P24: renderImageCardCanvas — Canvas API thay html2canvas cho ZIP export
       Nhanh hơn 10-20× trên mobile vì không cần DOM render/layout */
    function renderImageCardCanvas(project, img, stt) {
      return new Promise(function(resolve, reject) {
        var W = 600, PAD = 16;
        var isP   = img.status === 'production';
        var sLbl  = isP ? 'San xuat' : 'Khao sat';
        var pos   = (Array.isArray(img.positions)&&img.positions.length)?img.positions.join(' - '):(img.position||'Chua co');
        var curtain=(Array.isArray(img.curtainTypes)&&img.curtainTypes.length)?img.curtainTypes.join(' | '):(img.curtainType||'Chua co');
        var spec  = (Array.isArray(img.productSpecs)&&img.productSpecs.length)?img.productSpecs.join(' | '):(img.productSpec||'Chua co');
        var size  = (img.width&&img.height)?(img.width+' x '+img.height+' '+(img.unit||'mm')):'Chua co';
        var tags  = (Array.isArray(img.tags)&&img.tags.length)?img.tags.join(' | '):'Khong co';
        var note  = joinLines(img.notes)||'Khong co';
        var rows  = [['Tinh trang',sLbl],['Vi tri',pos],['Loai rem',curtain],
                     ['Quy cach SP',spec],['Kich thuoc',size],['Luu y',tags],['Ghi chu',note]];

        function wrapText(ctx, text, maxW, font) {
          ctx.font = font||'13px Arial';
          var str = String(text||'');
          if (ctx.measureText(str).width <= maxW) return [str];
          var lines=[], cur='';
          for (var i=0;i<str.length;i++) {
            var t=cur+str[i];
            if (ctx.measureText(t).width>maxW && cur) { lines.push(cur); cur=str[i]; }
            else { cur=t; }
          }
          if (cur) lines.push(cur);
          return lines;
        }

        var domImg = new Image();
        domImg.onload = function() {
          try {
            var maxIW=W-PAD*2, maxIH=220;
            var ratio=Math.min(1,maxIW/domImg.naturalWidth,maxIH/domImg.naturalHeight);
            var iW=Math.round(domImg.naturalWidth*ratio), iH=Math.round(domImg.naturalHeight*ratio);

            /* pre-calc row heights */
            var tmpC=document.createElement('canvas'); tmpC.width=1; tmpC.height=1;
            var tmpX=tmpC.getContext('2d');
            var labelW=110, valW=W-PAD*2-labelW-20, rowLineH=18, rowPadV=6;
            var rowHeights=rows.map(function(r){
              var ls=wrapText(tmpX,r[1],valW,'700 13px Arial');
              return ls.length*rowLineH+rowPadV*2;
            });
            var tableH=rowHeights.reduce(function(a,b){return a+b;},0)+PAD*2;
            tmpC.width=1; tmpC.height=1;

            var topH=PAD+14+6+28+10;
            var H=topH+iH+12+tableH+PAD;
            var canvas=document.createElement('canvas'); canvas.width=W; canvas.height=H;
            var ctx=canvas.getContext('2d');

            ctx.fillStyle='#fff'; ctx.fillRect(0,0,W,H);

            /* mini header */
            var y=PAD;
            ctx.font='11px Arial'; ctx.fillStyle='#9ca3af'; ctx.textAlign='right';
            var pm=(project.projectName||'')+(project.customerName?' - '+project.customerName:'');
            ctx.fillText(pm,W-PAD,y+11); y+=14+6;

            /* Anh # + badge */
            ctx.textAlign='left'; ctx.font='bold 15px Arial'; ctx.fillStyle='#111827';
            ctx.fillText('Anh #'+stt,PAD,y+16);
            var bx=PAD+ctx.measureText('Anh #'+stt).width+10, by=y+2;
            var bBg=isP?'#dcfce7':'#fef9c3', bClr=isP?'#166534':'#92400e';
            ctx.font='bold 11px Arial'; var bTW=ctx.measureText(sLbl).width+18;
            ctx.fillStyle=bBg;
            ctx.beginPath(); ctx.roundRect(bx,by,bTW,20,8); ctx.fill();
            ctx.fillStyle=bClr; ctx.fillText(sLbl,bx+9,by+14);
            y+=28+10;

            /* image */
            var ix=PAD+Math.round((maxIW-iW)/2);
            ctx.drawImage(domImg,ix,y,iW,iH);
            /* Draw annotations (P27) */
            if (Array.isArray(img.annotations) && img.annotations.length>0) {
              img.annotations.forEach(function(ann) {
                if (ann.type==='arrow') {
                  var ax1=ix+ann.x1/100*iW, ay1=y+ann.y1/100*iH;
                  var ax2=ix+ann.x2/100*iW, ay2=y+ann.y2/100*iH;
                  ctx.strokeStyle='#ef4444'; ctx.lineWidth=3;
                  ctx.beginPath(); ctx.moveTo(ax1,ay1); ctx.lineTo(ax2,ay2); ctx.stroke();
                  drawCanvasArrowHead(ctx,ax1,ay1,ax2,ay2,14);
                  if (ann.twoHeads) drawCanvasArrowHead(ctx,ax2,ay2,ax1,ay1,14);
                }
                if (ann.type==='text') {
                  var tx=ix+ann.x/100*iW, ty2=y+ann.y/100*iH;
                  ctx.font='bold 18px Arial';
                  ctx.strokeStyle='rgba(0,0,0,0.8)'; ctx.lineWidth=4; ctx.lineJoin='round';
                  ctx.strokeText(ann.text,tx,ty2);
                  ctx.fillStyle='#ef4444'; ctx.fillText(ann.text,tx,ty2);
                }
              });
            }
            y+=iH+12;

            /* table border */
            ctx.strokeStyle='#e5e7eb'; ctx.lineWidth=1;
            ctx.strokeRect(PAD,y,W-PAD*2,tableH);

            /* rows */
            var ty=y+PAD;
            rows.forEach(function(r,ri){
              var rh=rowHeights[ri];
              ctx.font='bold 13px Arial'; ctx.fillStyle='#374151'; ctx.textAlign='left';
              ctx.fillText(r[0],PAD+10,ty+rowPadV+rowLineH-3);
              ctx.font='bold 13px Arial'; ctx.fillStyle='#111827';
              var ls=wrapText(ctx,r[1],valW,'700 13px Arial');
              ls.forEach(function(ln,li){ ctx.fillText(ln,PAD+10+labelW,ty+rowPadV+(li+1)*rowLineH-3); });
              if (ri<rows.length-1){
                ctx.strokeStyle='#f3f4f6'; ctx.lineWidth=0.5;
                ctx.beginPath(); ctx.moveTo(PAD+1,ty+rh); ctx.lineTo(W-PAD-1,ty+rh); ctx.stroke();
              }
              ty+=rh;
            });

            var b64=canvas.toDataURL('image/jpeg',0.78).split(',')[1];
            canvas.width=1; canvas.height=1;
            resolve(b64);
          } catch(e){ reject(e); }
        };
        domImg.onerror=function(){ reject(new Error('Cannot load image')); };
        domImg.src=img.imagePreviewUrl||'';
      });
    }

    /* ─── buildSingleImageHTML ──────────────────────────────────────────────
       Tạo HTML cho 1 ảnh khảo sát riêng lẻ (dùng khi Xuất từng ảnh).
       Layout: ảnh trên, thông tin ảnh đó bên dưới.
       Container rộng 600px — đủ rõ, không quá nặng.
    ─────────────────────────────────────────────────────────────────────── */
    function buildSingleImageHTML(project, img, stt, themeHex) {
      themeHex = '#1f2937'; /* P19: ảnh xuất luôn dùng theme trắng */
      const isP  = img.status === 'production';
      const sBg  = isP ? '#dcfce7' : '#fef9c3';
      const sClr = isP ? '#166534' : '#92400e';
      const sLbl = isP ? 'Sản xuất' : 'Khảo sát';

      /* Vị trí */
      const pos = (Array.isArray(img.positions) && img.positions.length > 0)
        ? img.positions.join(' - ')
        : (img.position || 'Chưa có vị trí');

      /* Loại rèm */
      const curtain = (Array.isArray(img.curtainTypes) && img.curtainTypes.length > 0)
        ? img.curtainTypes.join(' | ')
        : (img.curtainType || 'Chưa có');

      /* Quy cách SP */
      const spec = (Array.isArray(img.productSpecs) && img.productSpecs.length > 0)
        ? img.productSpecs.join(' | ')
        : (img.productSpec || 'Chưa có');

      /* Kích thước */
      const size = (img.width && img.height)
        ? (img.width + ' × ' + img.height + ' ' + (img.unit || 'mm'))
        : 'Chưa có kích thước';

      /* Lưu ý */
      const tags = (Array.isArray(img.tags) && img.tags.length > 0)
        ? img.tags.join(' | ')
        : 'Không có';

      /* Ghi chú */
      const note = joinLines(img.notes) || 'Không có';

      /* Bảng thông tin — label cột cố định 110px */
      function row(label, value) {
        return (
          '<tr>' +
          '<td style="padding:4px 0;color:#374151;white-space:nowrap;width:110px;vertical-align:top;font-size:13px;font-weight:600">' + escapeHtml(label) + '</td>' +
          '<td style="padding:4px 0 4px 8px;font-size:13px;font-weight:700;color:#111827;word-break:break-word">' + escapeHtml(value) + '</td>' +
          '</tr>'
        );
      }

      const infoTable =
        row('Tình trạng', sLbl) +
        row('Vị trí',     pos)   +
        row('Loại rèm',   curtain) +
        row('Quy cách SP', spec)  +
        row('Kích thước', size)  +
        row('Lưu ý',      tags)  +
        row('Ghi chú',    note);

      /* Tên công trình nhỏ gọn ở header */
      const projectMini =
        '<div style="font-size:10px;color:#9ca3af;text-align:right;margin-bottom:6px">' +
        escapeHtml(project.projectName || '') +
        (project.customerName ? (' — ' + escapeHtml(project.customerName)) : '') +
        '</div>';

      return (
        '<div style="width:600px;background:#fff;font-family:Arial,sans-serif;padding:16px;box-sizing:border-box">' +
        projectMini +
        /* Header STT + badge tình trạng */
        '<div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">' +
          '<span style="font-size:16px;font-weight:400;color:#111827">Ảnh #' + stt + '</span>' +
          '<span style="padding:2px 10px;border-radius:12px;font-size:12px;font-weight:600;background:' + sBg + ';color:' + sClr + '">' + sLbl + '</span>' +
        '</div>' +
        /* Ảnh gốc + annotation overlay (P27) */
        (function(){
          var annSvg='';
          if(Array.isArray(img.annotations)&&img.annotations.length>0){
            var svgParts=img.annotations.map(function(ann){
              if(ann.type==='arrow'){
                var dx=ann.x2-ann.x1,dy=ann.y2-ann.y1,len=Math.sqrt(dx*dx+dy*dy);
                if(len<0.001)return '';
                var ux=dx/len,uy=dy/len,px=-uy,py=ux,S=4,ss=S*0.45;
                var p2=ann.x2+','+ann.y2+' '+(ann.x2-ux*S+px*ss)+','+(ann.y2-uy*S+py*ss)+' '+(ann.x2-ux*S-px*ss)+','+(ann.y2-uy*S-py*ss);
                var p1=ann.twoHeads?('<polygon points="'+(ann.x1+','+ann.y1+' '+(ann.x1+ux*S+px*ss)+','+(ann.y1+uy*S+py*ss)+' '+(ann.x1+ux*S-px*ss)+','+(ann.y1+uy*S-py*ss))+'" fill="#ef4444"/>')  :'';
                return '<line x1="'+ann.x1+'" y1="'+ann.y1+'" x2="'+ann.x2+'" y2="'+ann.y2+'" stroke="#ef4444" stroke-width="1.5"/>'
                  +'<polygon points="'+p2+'" fill="#ef4444"/>'+p1;
              }
              if(ann.type==='text')return '<text x="'+ann.x+'" y="'+ann.y+'" font-size="4" font-weight="bold" font-family="Arial" stroke="rgba(0,0,0,0.75)" stroke-width="0.5" paint-order="stroke" fill="#ef4444">'+escapeHtml(ann.text)+'</text>';
              return '';
            }).join('');
            annSvg='<svg style="position:absolute;inset:0;width:100%;height:100%;" viewBox="0 0 100 100" preserveAspectRatio="none">'+svgParts+'</svg>';
          }
          return '<div style="position:relative;margin-bottom:12px">'
            +'<img src="'+(img.imagePreviewUrl||'')+'" '
            +'style="width:100%;max-height:220px;object-fit:contain;border-radius:6px;background:#f3f4f6;display:block" />'
            +annSvg+'</div>';
        })() +
        /* Bảng thông tin */
        '<div style="border:1px solid #e5e7eb;border-radius:6px;padding:10px 12px">' +
          '<table style="width:100%;border-collapse:collapse;table-layout:fixed">' +
            '<col style="width:110px" /><col />' +
            infoTable +
          '</table>' +
        '</div>' +
        '</div>'
      );
    }

    /* Tạo HTML string cho báo cáo — dùng với html2canvas */
    /* ─── buildReportHTML ───────────────────────────────────────────────────
       Tạo HTML string cho báo cáo. opts = { singlePage: bool }

    function buildReportHTML(project, images, opts, sttList, themeHex) {

        '</div>';

      /* Danh sách card ảnh — thumbnail cố định, label cột cố định */
      const THUMB_W = 130;
      const THUMB_H = 95;
      const LABEL_W = 90; /* px — cột label cố định, value nằm ngay sau */

      const imagesHTML = total === 0

            const infoRows2 = [

          'Danh sách ảnh khảo sát (' + total + ')' +

      );

    function getTodayString() {

      return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;

    /* --- Toast --- */

    /* ─────────────────────────────────────────────

                <div className="proj-summary-item full-width">

                {/* Thống kê ảnh */}

                  <span className="proj-summary-label">Khảo sát</span>

    /* --- Card nhỏ trong grid 3 cột (Prompt 10.1) --- */
    function ProjectGridCard({ project, progress, isExpanded, onToggle, onLongPress }) {
      const isReady  = progress.projectGroup === 'readyForProduction';
      const dotCls   = isReady ? 'ready' : 'surveying';
      const subText  = progress.totalActiveImages > 0
        ? `${progress.totalActiveImages} ảnh`
        : (isReady ? 'Sẵn sàng SX' : 'Khảo sát');
      const lpTimer  = React.useRef(null);
      const lpFired  = React.useRef(false);   // true khi long-press đã kích hoạt

      function startLP() {
        lpFired.current = false;
        lpTimer.current = setTimeout(function() {
          lpFired.current = true;
          lpTimer.current = null;
          onLongPress && onLongPress(project.projectId);
        }, 500);
      }
      function cancelLP() {
        if (lpTimer.current) { clearTimeout(lpTimer.current); lpTimer.current = null; }
      }
      function handleClick() {
        // onClick luôn chạy sau touchend — chỉ bỏ qua nếu long-press đã kích hoạt
        if (!lpFired.current) onToggle();
        lpFired.current = false;
      }

      return (
        <div
          className={`proj-grid-card${isExpanded ? ' is-expanded' : ''}`}
          onTouchStart={startLP}
          onTouchEnd={cancelLP}
          onTouchMove={cancelLP}
          onMouseDown={startLP}
          onMouseUp={cancelLP}
          onMouseLeave={cancelLP}
          onClick={handleClick}
          role="button"
          aria-expanded={isExpanded}
          aria-label={`${isExpanded ? 'Thu gọn' : 'Xem tóm tắt'}: ${project.projectName}`}
        >
          <div className="proj-grid-name">{project.projectName}</div>
          <div className="proj-grid-sub">
            <span className={`proj-grid-dot ${dotCls}`} />
            <span>{subText}</span>
          </div>
        </div>
      );
    }

    /* --- Settings Screen --- */
    function SettingsScreen({ onBack }) {
      const [settings, setSettings] = useState(getSettings);
      function handleColorChange(color) {
        const next = { ...settings, backgroundColor: color };
        setSettings(next);
        saveSettings({ backgroundColor: color });
        applyTheme(color);
      }
      function handleUserNameChange(e) {
        const val = e.target.value;
        setSettings(s => ({ ...s, userName: val }));
        saveSettings({ userName: val });
      }
      const swatches = [
        { key: 'white',  label: 'Trắng',   bg: '#f3f4f6', border: '#d1d5db' },
        { key: 'dark',   label: 'Đen',     bg: '#0f172a', border: '#334155' },
        { key: 'orange', label: 'Cam',     bg: '#fed7aa', border: '#ea580c' },
        { key: 'green',  label: 'Xanh lá', bg: '#86efac', border: '#16a34a' },
      ];
      return (
        <div className="app-container">
          <header className="page-header">
            <button className="btn-back" onClick={onBack}>‹</button>
            <h1>Cài đặt</h1>
          </header>
          <div className="settings-screen page-content">
            <div className="settings-section">
              <div className="settings-section-title">Màu nền ứng dụng</div>
              <div className="settings-row">
                <span className="settings-row-label">Chọn màu nền</span>
                <div className="settings-color-group">
                  {swatches.map(sw => (
                    <div key={sw.key}
                      className={`settings-color-swatch${settings.backgroundColor === sw.key ? ' active' : ''}`}
                      style={{ background: sw.bg, borderColor: settings.backgroundColor === sw.key ? 'var(--primary)' : sw.border }}
                      title={sw.label}
                      onClick={() => handleColorChange(sw.key)}
                    />
                  ))}
                </div>
              </div>
            </div>
            <div className="settings-section">
              <div className="settings-section-title">Thông tin người dùng</div>
              <div className="settings-input-wrap">
                <label style={{fontSize:13, color:'var(--text-secondary)', display:'block', marginBottom:6}}>
                  Tên người dùng (tự điền "Người khảo sát" khi tạo công trình)
                </label>
                <input className="settings-input" type="text"
                  placeholder="Nhập tên người dùng"
                  value={settings.userName}
                  onChange={handleUserNameChange}
                  maxLength={60}
                />
              </div>
            </div>
          </div>
        </div>
      );
    }

    /* --- Trash Screen (P24) --- */
    function TrashScreen({ onBack }) {
      const [items, setItems] = useState(function() { return getDeletedProjects(); });
      const [confirmId, setConfirmId] = useState(null);

      function handleRestore(projectId) {
        restoreProject(projectId);
        setItems(getDeletedProjects());
      }
      function handlePermanentDelete(projectId) {
        permanentDeleteProject(projectId);
        setItems(getDeletedProjects());
        setConfirmId(null);
      }

      return (
        <div className="app-container">
          <header className="page-header">
            <button className="btn-back" onClick={onBack}>‹</button>
            <h1>Thùng rác</h1>
          </header>
          <div className="page-content">
            {items.length === 0 ? (
              <div className="empty-state">
                <div className="empty-icon">🗑️</div>
                <div className="empty-title">Thùng rác trống</div>
                <div className="empty-desc">Chưa có công trình nào bị xóa.</div>
              </div>
            ) : (
              <>
                <div style={{fontSize:13, color:'var(--text-secondary)', marginBottom:12}}>
                  {items.length} công trình đã xóa — nhấn Khôi phục để đưa về danh sách.
                </div>
                {items.map(p => (
                  <div key={p.projectId} className="trash-item">
                    <div className="trash-item-name">{p.projectName || '(Không tên)'}</div>
                    <div className="trash-item-date">
                      Xóa lúc: {p.deletedAt ? formatDate(p.deletedAt) : '—'}
                      {p.customerName ? ' · ' + p.customerName : ''}
                    </div>
                    <div className="trash-item-actions">
                      <button className="trash-btn-restore" onClick={() => handleRestore(p.projectId)}>↩ Khôi phục</button>
                      <button className="trash-btn-delete" onClick={() => setConfirmId(p.projectId)}>🗑️ Xóa vĩnh viễn</button>
                    </div>
                  </div>
                ))}
              </>
            )}
          </div>

          {/* Confirm xóa vĩnh viễn */}
          {confirmId && (() => {
            const p = items.find(x => x.projectId === confirmId);
            return (
              <div className="modal-overlay" onClick={() => setConfirmId(null)}>
                <div className="modal-box" onClick={e => e.stopPropagation()}>
                  <div className="modal-icon">⚠️</div>
                  <div className="modal-title">Xóa vĩnh viễn?</div>
                  <div className="modal-desc">
                    Công trình <strong>{p ? p.projectName : ''}</strong> và toàn bộ ảnh sẽ bị xóa hoàn toàn, không thể khôi phục.
                  </div>
                  <div className="modal-btns">
                    <button className="btn btn-secondary" style={{flex:1}} onClick={() => setConfirmId(null)}>Hủy</button>
                    <button className="btn btn-danger" style={{flex:1, background:'#dc2626', color:'#fff', border:'none', borderRadius:10, padding:'12px 0', fontWeight:700, cursor:'pointer', fontFamily:'Arial,sans-serif', fontSize:14}} onClick={() => handlePermanentDelete(confirmId)}>Xóa</button>
                  </div>
                </div>
              </div>
            );
          })()}
        </div>
      );
    }

    /* --- Project List Screen  (Prompt 10: 2 nhóm + accordion) --- */
    function ProjectList({ onCreateNew, onSelectProject, onOpenTagManager, onOpenSettings, onOpenTrash }) {
      const [projects, setProjects] = useState([]);
      // imageVersion: tăng khi nhận imagesUpdated → buộc recompute progress
      const [imageVersion, setImageVersion] = useState(0);
      // expandedProjectId: chỉ 1 công trình mở rộng tại 1 thời điểm
      const [expandedProjectId, setExpandedProjectId] = useState(null);
      // longPressProjectId: card đang chờ context menu (P24)
      const [longPressId, setLongPressId] = useState(null);

      useEffect(() => {
        setProjects(getProjects());
        const onProjectsUpdated = () => setProjects(getProjects());
        const onImagesUpdated   = () => setImageVersion(v => v + 1);
        window.addEventListener('projectsUpdated', onProjectsUpdated);
        window.addEventListener('imagesUpdated',   onImagesUpdated);
        return () => {
          window.removeEventListener('projectsUpdated', onProjectsUpdated);
          window.removeEventListener('imagesUpdated',   onImagesUpdated);
        };
      }, []);

      /* Tính progress cho từng project — tính lại khi imageVersion thay đổi */
      const projectsWithProgress = projects.map(p => ({
        ...p,
        _progress: getProjectProgress(p.projectId),
      }));

      /* Phân nhóm */
      const surveyingProjects = projectsWithProgress.filter(p => p._progress.projectGroup === 'surveying');
      const readyProjects     = projectsWithProgress.filter(p => p._progress.projectGroup === 'readyForProduction');

      function handleToggle(projectId) {
        setExpandedProjectId(prev => prev === projectId ? null : projectId);
      }

      function renderGroup(label, groupKey, items) {
        const badgeCls = groupKey === 'readyForProduction' ? 'ready' : 'surveying';
        const emptyMsg = groupKey === 'readyForProduction'
          ? 'Chưa có công trình sẵn sàng sản xuất'
          : 'Chưa có công trình đang khảo sát';

        // Chia items thành các hàng 3 cột
        const rows = [];
        for (let i = 0; i < items.length; i += 3) rows.push(items.slice(i, i + 3));

        return (
          <div className="project-group-section" key={groupKey}>
            <div className="project-group-header">
              <span className="project-group-label">{label}</span>
              <span className={`project-group-badge ${badgeCls}`}>{items.length}</span>
            </div>
            {items.length === 0 ? (
              <div className="proj-group-empty">{emptyMsg}</div>
            ) : (
              rows.map((row, rowIdx) => {
                const expanded = row.find(p => p.projectId === expandedProjectId);
                return (
                  <React.Fragment key={rowIdx}>
                    {/* Hàng 3 card */}
                    <div className="proj-grid-row">
                      {row.map(p => (
                        <ProjectGridCard
                          key={p.projectId}
                          project={p}
                          progress={p._progress}
                          isExpanded={expandedProjectId === p.projectId}
                          onToggle={() => handleToggle(p.projectId)}
                          onLongPress={pid => setLongPressId(pid)}
                        />
                      ))}
                      {/* Ô trống giữ đủ 3 cột ở hàng cuối */}
                      {row.length < 3 && Array.from({length: 3 - row.length}).map((_, i) => (
                        <div key={`pad-${i}`} className="proj-grid-pad" />
                      ))}
                    </div>

                    {/* Panel tóm tắt — hiện ngay dưới hàng có card đang mở */}
                    {expanded && (() => {
                      const p = expanded;
                      const prog = p._progress;
                      const groupLabel = prog.projectGroup === 'readyForProduction' ? 'Sẵn sàng sản xuất' : 'Đang khảo sát';
                      const groupCls   = prog.projectGroup === 'readyForProduction' ? 'status-ready' : 'status-surveying';
                      return (
                        <div className="proj-grid-expanded-panel">
                          <div className="proj-expanded-title">{p.projectName}</div>
                          <div className="proj-summary-grid">
                            <div className="proj-summary-item">
                              <span className="proj-summary-label">Khách hàng</span>
                              <span className="proj-summary-value">{p.customerName || '—'}</span>
                            </div>
                            <div className="proj-summary-item">
                              <span className="proj-summary-label">Ngày khảo sát</span>
                              <span className="proj-summary-value">{formatDate(p.surveyDate)}</span>
                            </div>
                            <div className="proj-summary-item full-width">
                              <span className="proj-summary-label">Người liên hệ</span>
                              <span className="proj-summary-value">{p.contactPerson || '—'}</span>
                            </div>
                            <div className="proj-summary-item full-width">
                              <span className="proj-summary-label">Số điện thoại</span>
                              <span className="proj-summary-value">{p.contactPhone || '—'}</span>
                            </div>
                            <div className="proj-summary-item full-width">
                              <span className="proj-summary-label">Địa chỉ</span>
                              <span className="proj-summary-value">{p.address || '—'}</span>
                            </div>
                            <div className="proj-summary-item full-width">
                              <span className="proj-summary-label">Người khảo sát</span>
                              <span className="proj-summary-value">{p.surveyPerson || '—'}</span>
                            </div>
                            <div className="proj-summary-item">
                              <span className="proj-summary-label">Tổng ảnh</span>
                              <span className="proj-summary-value">{prog.totalActiveImages}</span>
                            </div>
                            <div className="proj-summary-item">
                              <span className="proj-summary-label">Trạng thái</span>
                              <span className={`proj-summary-value ${groupCls}`}>{groupLabel}</span>
                            </div>
                            <div className="proj-summary-item">
                              <span className="proj-summary-label">Khảo sát</span>
                              <span className="proj-summary-value">{prog.surveyImages}</span>
                            </div>
                            <div className="proj-summary-item">
                              <span className="proj-summary-label">Sản xuất</span>
                              <span className="proj-summary-value">{prog.productionImages}</span>
                            </div>
                          </div>
                          <button className="proj-enter-btn" onClick={() => onSelectProject(p.projectId)}>
                            Vào chi tiết →
                          </button>
                        </div>
                      );
                    })()}
                  </React.Fragment>
                );
              })
            )}
          </div>
        );
      }

      return (
        <div className="app-container">
          {/* Header sticky xanh */}
          <header className="page-header">
            <div style={{flex:1}}>
              <h1>MrCurtain Survey</h1>
              <div className="header-subtitle">Hệ thống khảo sát công trình
                <span className="header-version-badge">{APP_PROMPT_VERSION}</span>
              </div>
            </div>
            <button className="btn-settings" onClick={onOpenSettings} title="Cài đặt">⚙️</button>
          </header>

          {/* Action bar gọn: đếm + 2 nút nhỏ */}
          <div className="home-action-bar">
            <span className="home-stats-text">
              <strong>{projects.length}</strong> công trình
            </span>
            <button className="home-action-btn" onClick={onCreateNew}>
              Tạo mới
            </button>
            <button className="home-action-btn" onClick={onOpenTagManager}>
              <span className="home-action-btn-icon">🏷️</span>
              Hashtag
            </button>
            {(() => {
              const trashCount = getDeletedProjects().length;
              return (
                <button className="home-action-btn" onClick={onOpenTrash} title="Thùng rác">
                  <span className="home-action-btn-icon">🗑️</span>
                  {trashCount > 0 && <span style={{fontSize:11,fontWeight:700,background:'#dc2626',color:'#fff',borderRadius:'50%',padding:'1px 5px',marginLeft:2}}>{trashCount}</span>}
                </button>
              );
            })()}
          </div>

          {/* Context menu: long-press trên card (P24) */}
          {longPressId && (() => {
            const proj = projects.find(p => p.projectId === longPressId);
            return (
              <div className="ctx-sheet" onClick={() => setLongPressId(null)}>
                <div className="ctx-sheet-box" onClick={e => e.stopPropagation()}>
                  <div className="ctx-sheet-handle" />
                  <div className="ctx-sheet-title">{proj ? proj.projectName : ''}</div>
                  <button className="ctx-sheet-btn" onClick={() => { setLongPressId(null); onSelectProject(longPressId); }}>
                    <span className="ctx-sheet-icon">📂</span> Vào chi tiết
                  </button>
                  <button className="ctx-sheet-btn danger" onClick={() => {
                    softDeleteProject(longPressId);
                    setLongPressId(null);
                  }}>

    /* ─────────────────────────────────────────────
       IMAGE DETAIL  (Prompt 6)
       Màn hình gắn thông tin cho từng ảnh khảo sát
