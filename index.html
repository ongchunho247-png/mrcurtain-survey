                ← Quay lại danh sách
              </button>
            </div>
          </div>
        );
      }

      /* --- Loading --- */
      if (!project) {
        return (
          <div className="app-container">
            <header className="page-header">
              <button className="btn-back" onClick={onBack}>‹</button>
              <h1>Chi tiết công trình</h1>
            </header>
            <div className="empty-state">
              <div style={{fontSize:'32px'}}>⏳</div>
              <div>Đang tải...</div>
            </div>
          </div>
        );
      }

      /* ─── runExport(type, layout) ────────────────────────────────────────
         type   : 'pdf' | 'image' | 'individual'
         layout : 'single' | 'multi' | null
         Chiến lược multi-page PDF:
           - Render toàn bộ báo cáo trong div ẩn
           - Ghi nhận offsetTop/offsetHeight của từng card
           - html2canvas scale=2
           - Chia canvas thành các trang A4, điều chỉnh điểm cắt để
             không cắt ngang bất kỳ card nào
      ─────────────────────────────────────────────────────────────────── */
      async function runExport(type, layout, indivOpts, filterImageIds) {
        const exportKey = (type === 'individual') ? 'individual-zip' : (layout ? (type + '-' + layout) : type);
        setExporting(exportKey);
        try {
          let activeImages = getImages(projectId);
          // Lọc theo ảnh đã chọn (Prompt 14.5) — giữ nguyên STT gốc
          let sttList = null;
          if (filterImageIds && filterImageIds.length > 0) {
            const sttMap = {};
            activeImages.forEach((img, idx) => { sttMap[img.imageId] = idx + 1; });
            activeImages = activeImages.filter(img => filterImageIds.includes(img.imageId));
            sttList = activeImages.map(img => sttMap[img.imageId]);
          }

          /* ── Xuất từng ảnh → gom ZIP có folder tên công trình ── */
          if (type === 'individual') {
            /* Xác định danh sách ảnh cần xuất */
            let exportItems;
            if (sttList) {
              // Ảnh đã chọn — giữ STT gốc (Prompt 14.5)
              exportItems = activeImages.map((img, idx) => ({ img, stt: sttList[idx] }));
            } else if (indivOpts && indivOpts.mode === 'custom' && indivOpts.stts) {
              exportItems = indivOpts.stts
                .map(stt => ({ img: activeImages[stt - 1], stt }))
                .filter(item => item.img != null);
            } else {
              exportItems = activeImages.map((img, idx) => ({ img, stt: idx + 1 }));
            }

            const total = exportItems.length;
            if (total === 0) {
              alert('Không có ảnh nào để xuất.');
              return;
            }

            /* Tên folder & tên ZIP */
            const folderName = sanitizeFileName(project.projectName) || 'Cong-trinh-khao-sat';
            const today      = new Date().toISOString().slice(0, 10);
            const zipName    = folderName + ' - Anh khao sat - ' + today + '.zip';

            /* Khởi tạo JSZip */
            if (typeof JSZip === 'undefined') {
              alert('Thư viện JSZip chưa tải. Vui lòng tải lại trang và thử lại.');
              return;
            }
            const zip    = new JSZip();
            const folder = zip.folder(folderName);

            for (let i = 0; i < exportItems.length; i++) {
              const { img, stt } = exportItems[i];
              if (!img.imagePreviewUrl) continue;

              setExporting('Đang xuất ảnh ' + (i + 1) + '/' + total + '...');

              /* P24: Canvas API trực tiếp — không dùng html2canvas */
              try {
                await new Promise(r => setTimeout(r, 30));
                const b64 = await renderImageCardCanvas(project, img, stt);
                folder.file(buildImageFileName(stt, img).replace('.png', '.jpg'), b64, { base64: true });
              } catch (imgErr) {
                storageLog('ERROR', 'chi-tiet', 'runExport/canvas',
                  'Loi render anh stt=' + stt, formatError(imgErr));
              }
            }

            /* Tạo ZIP và hiển thị ShareModal */
            setExporting('Đang nén file ZIP...');
            /* level:1 = fastest (Huffman only) — đủ nhanh trên mobile */
            const zipBlob = await zip.generateAsync({ type: 'blob', compression: 'DEFLATE',
              compressionOptions: { level: 1 } });
            setExportResult({ blob: zipBlob, filename: zipName, mimeType: 'application/zip' });
            setShowShareModal(true);
            return;
          }

          /* ── Tạo container ẩn ── */
          const container = document.createElement('div');
          container.style.cssText = 'position:fixed;left:-9999px;top:0;width:740px;background:#fff;padding:0;margin:0;z-index:-1;';
          const themeHex = document.documentElement.style.getPropertyValue('--header-bg').trim() || '#1f2937';
          container.innerHTML = buildReportHTML(project, activeImages, { singlePage: layout === 'single' }, sttList, themeHex);
          document.body.appendChild(container);

          /* Chờ ảnh load */
          const imgEls = container.querySelectorAll('img');
          await Promise.all(Array.from(imgEls).map(el =>
            new Promise(resolve => {
              if (el.complete) resolve();
              else { el.onload = resolve; el.onerror = resolve; }
            })
          ));

          /* Lấy vị trí từng card TRƯỚC khi html2canvas (dùng offsetTop) */
          const cardEls = Array.from(container.querySelectorAll('[data-card-idx]'));
          const cardBounds = cardEls.map(card => {
            let top = 0;
            let el  = card;
            while (el && el !== container) { top += el.offsetTop; el = el.offsetParent; }
            return { top, bottom: top + card.offsetHeight };
          });

          /* Chụp toàn bộ — scale thấp hơn trên mobile để không bị treo */
          const SCALE = window.innerWidth < 768 ? 1.0 : 2;
          const canvas = await html2canvas(container, {
            scale: SCALE, useCORS: true, allowTaint: true, backgroundColor: '#ffffff'
          });
          document.body.removeChild(container);

          /* ── Xuất ảnh báo cáo (.png) ── */
          if (type === 'image') {
            const filename = buildReportFileName(project, 'png');
            const pngBlob  = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
            setExportResult({ blob: pngBlob, filename, mimeType: 'image/png' });
            setShowShareModal(true);
            return;
          }

          /* ── Xuất PDF ── */
          const { jsPDF } = window.jspdf;
          const pdf  = new jsPDF({ orientation: 'p', unit: 'mm', format: 'a4' });
          const pW   = pdf.internal.pageSize.getWidth();   // 210 mm
          const pH   = pdf.internal.pageSize.getHeight();  // 297 mm
          const mmPerPx = pW / canvas.width;               // mm mỗi pixel canvas
          const pageH_px = Math.floor(pH / mmPerPx);       // chiều cao trang theo pixel canvas

          if (layout === 'single') {
            /* Fit toàn bộ vào 1 trang */
            const imgData  = canvas.toDataURL('image/jpeg', 0.88);
            const imgH_mm  = canvas.height * mmPerPx;
            if (imgH_mm <= pH) {
              pdf.addImage(imgData, 'JPEG', 0, 0, pW, imgH_mm);
            } else {
              /* Nội dung cao hơn 1 trang — scale down để vừa, không cắt */
              const scale2  = pH / imgH_mm;
              const fitW    = pW * scale2;
              const marginX = (pW - fitW) / 2;
              pdf.addImage(imgData, 'JPEG', marginX, 0, fitW, pH);
            }
            const filename = buildReportFileName(project, 'pdf');
            const pdfBlob  = pdf.output('blob');
            setExportResult({ blob: pdfBlob, filename, mimeType: 'application/pdf' });
            setShowShareModal(true);
            return;
          }

          /* ── Multi-page: tách trang không cắt card ── */
          const scaledBounds = cardBounds.map(b => ({
            top:    Math.floor(b.top    * SCALE),
            bottom: Math.ceil( b.bottom * SCALE),
          }));

          let currentY   = 0;
          let isFirstPage = true;
          const MARGIN_PX = Math.floor(4 * SCALE); /* khoảng trống nhỏ trên card khi xuống trang */

          while (currentY < canvas.height) {
            const idealNextY = currentY + pageH_px;

            /* Tìm card bị cắt bởi ranh giới trang này */
            let cutY = idealNextY;
            for (const b of scaledBounds) {
              if (b.top < idealNextY && b.bottom > idealNextY) {
                /* Card này sẽ bị cắt → lui điểm cắt lên đầu card */
                const proposedCut = b.top - MARGIN_PX;
                cutY = proposedCut > currentY ? proposedCut : idealNextY;
                break;
              }
            }
            cutY = Math.min(Math.max(cutY, currentY + 1), canvas.height);

            const sliceH = cutY - currentY;
            if (sliceH <= 0) break;

            /* Cắt canvas */
            const sliceCanvas = document.createElement('canvas');
            sliceCanvas.width  = canvas.width;
            sliceCanvas.height = sliceH;
            sliceCanvas.getContext('2d').drawImage(
              canvas, 0, currentY, canvas.width, sliceH, 0, 0, canvas.width, sliceH
            );

            const sliceData  = sliceCanvas.toDataURL('image/jpeg', 0.88);
            const sliceH_mm  = sliceH * mmPerPx;

            if (!isFirstPage) pdf.addPage();
            pdf.addImage(sliceData, 'JPEG', 0, 0, pW, sliceH_mm);
            isFirstPage = false;
            currentY = cutY;
          }
          const filename = buildReportFileName(project, 'pdf');
          const pdfBlob  = pdf.output('blob');
          setExportResult({ blob: pdfBlob, filename, mimeType: 'application/pdf' });
          setShowShareModal(true);

        } catch (err) {
          storageLog('ERROR', 'chi-tiet', 'runExport()', 'Loi xuat (' + type + '-' + layout + ')', formatError(err));
          alert('Không thể xuất báo cáo. Vui lòng thử lại.');
        } finally {
          setExporting(null);
          setShowExportModal(false);
        }
      }


      const badgeClass = project.department === 'sale' ? 'badge-sale' : 'badge-technical';

      return (
        <div className="app-container">
          {/* ── Header ── */}

            <h1 style={{flex:1}}>Chi tiết công trình</h1>

          <div className="page-content">

                {!editMode && (

              </div>

              {/* Nội dung — chỉ render khi mở */}

    /* --- Project Form Screen --- */
    const REQUIRED = {
      projectName: 'Tên công trình',
      customerName: 'Tên khách hàng',
      surveyPerson: 'Người khảo sát',
      surveyDate: 'Ngày khảo sát',
    };

    const INITIAL = {
      projectName:   '',
      customerName:  '',
      contactPerson: '',
      contactPhone:  '',
      address:       '',
      surveyPerson:  '',
      department:    'sale',
      surveyDate:    getTodayString(),
      generalNote:   '',
    };

    function ProjectForm({ onBack, onSaved }) {
      const [form, setForm] = useState(() => {
        const s = getSettings();
        return { ...INITIAL, surveyPerson: s.userName || '' };
      });
      const [errors, setErrors] = useState({});
      const [saving, setSaving] = useState(false);
      const [showConfirm, setShowConfirm] = useState(false);

      const isDirty = ['projectName','customerName','address','surveyPerson','generalNote']
        .some(k => form[k] !== INITIAL[k]);

      function handleChange(e) {
        const { name, value } = e.target;
        setForm(prev => ({ ...prev, [name]: value }));
        if (errors[name]) setErrors(prev => ({ ...prev, [name]: null }));
      }

      function validate() {
        const errs = {};
        Object.entries(REQUIRED).forEach(([field, label]) => {
          if (!form[field] || !form[field].toString().trim()) {
            errs[field] = `${label} không được để trống`;
          }
        });
        return errs;
      }

      function handleSave() {
        const errs = validate();
        if (Object.keys(errs).length > 0) {
          setErrors(errs);
          window.scrollTo({ top: 0, behavior: 'smooth' });
          return;
        }
        setSaving(true);
        try {
          const saved = saveProject({
            projectName:   form.projectName.trim(),
            customerName:  form.customerName.trim(),
            contactPerson: form.contactPerson.trim(),
            contactPhone:  form.contactPhone.trim(),
            address:       form.address.trim(),
            surveyPerson:  form.surveyPerson.trim(),
            department:    form.department,
            surveyDate:    form.surveyDate,
            generalNote:   form.generalNote.trim(),
          });
          window.dispatchEvent(new Event('projectsUpdated'));
          onSaved(saved);
        } catch (err) {
          console.error('[Form] Lỗi lưu:', err);
          alert('Có lỗi xảy ra khi lưu. Vui lòng thử lại.');
          setSaving(false);
        }
      }

      function handleCancel() {
        if (isDirty) setShowConfirm(true);
        else onBack();
      }

      const hasErrors = Object.values(errors).some(Boolean);

      return (
        <div className="app-container">

            <h1>Tạo công trình mới</h1>

                </label>
                <input
                  id="projectName" name="projectName" type="text"
                  className={`form-input${errors.projectName ? ' has-error' : ''}`}
                  placeholder="VD: Căn hộ Vinhomes Q9 - P1201"
                  value={form.projectName} onChange={handleChange} autoComplete="off"
                />
                {errors.projectName && <div className="form-error"><span>⚠</span>{errors.projectName}</div>}
              </div>

              <div className="form-group">
                <label className="form-label" htmlFor="customerName">
                  Tên khách hàng <span className="required">*</span>
                </label>
                <input
                  id="customerName" name="customerName" type="text"
                  className={`form-input${errors.customerName ? ' has-error' : ''}`}
                  placeholder="Họ tên khách hàng"
                  value={form.customerName} onChange={handleChange} autoComplete="off"
                />
                {errors.customerName && <div className="form-error"><span>⚠</span>{errors.customerName}</div>}
              </div>

              <div className="form-group">
                <label className="form-label" htmlFor="contactPerson">Người liên hệ</label>
                <input
                  id="contactPerson" name="contactPerson" type="text"
                  className="form-input"
                  placeholder="Nhập người liên hệ"
                  value={form.contactPerson} onChange={handleChange} autoComplete="off"

              </div>

              <div className="form-group">
                <label className="form-label" htmlFor="contactPhone">Số điện thoại</label>
                <input
                  id="contactPhone" name="contactPhone" type="tel"
                  className="form-input"
                  placeholder="Nhập số điện thoại"

              <div className="form-group">
                <label className="form-label" htmlFor="address">Địa chỉ công trình</label>

                  id="address" name="address" type="text"

            <div className="form-section">
              <div className="form-section-title">Ghi chú chung</div>
              <div className="form-group">

                <textarea

            {/* Actions */}

    /* --- Tag Manager Screen (Prompt 9 + 9.1 kéo thả) --- */
    function TagManager({ onBack }) {
      const [tags, setTags]               = useState(() => getTags());
      const [activeGroup, setActiveGroup] = useState(HASHTAG_GROUPS.find(g => !g.hidden)?.id || HASHTAG_GROUPS[0].id);
      const [editingId, setEditingId]     = useState(null);
      const [editValue, setEditValue]     = useState('');
      const [editError, setEditError]     = useState('');
      const [newTagValue, setNewTagValue] = useState('');
      const [addError, setAddError]       = useState('');
      const [showHidden, setShowHidden]       = useState(false);
      const [tmToast, setTmToast]             = useState(null);
      const [confirmDeleteTagId, setConfirmDeleteTagId] = useState(null); // tagId chờ xác nhận xóa bỏ
      const sortableListRef = React.useRef(null);
      const sortableRef     = React.useRef(null);

      function reloadTags() { setTags(getTags()); }

      function showTmToast(msg) {
        setTmToast(msg);
        setTimeout(() => setTmToast(null), 2200);
      }

      function switchGroup(groupId) {
        setActiveGroup(groupId);
        setEditingId(null);
        setEditValue('');
        setEditError('');
        setNewTagValue('');
        setAddError('');
        setShowHidden(false);
      }

      // Chỉ hiện tab cho nhóm không bị ẩn khỏi UI
      const visibleGroups = HASHTAG_GROUPS.filter(g => !g.hidden);
      const currentGroup = HASHTAG_GROUPS.find(g => g.id === activeGroup);
      const activeTags = tags
        .filter(t => t.tagGroup === activeGroup && t.isActive)
        .sort((a, b) => (a.sortOrder ?? 999) - (b.sortOrder ?? 999));
      const hiddenTags = tags
        .filter(t => t.tagGroup === activeGroup && !t.isActive)
        .sort((a, b) => (a.sortOrder ?? 999) - (b.sortOrder ?? 999));

      useEffect(() => {
        if (!sortableListRef.current || typeof Sortable === 'undefined') return;
        if (sortableRef.current) {
          sortableRef.current.destroy();
          sortableRef.current = null;
        }
        sortableRef.current = Sortable.create(sortableListRef.current, {
          animation: 150,
          handle: '.tag-drag-handle',
          ghostClass: 'sortable-ghost',
          chosenClass: 'sortable-chosen',
          forceFallback: false,
          fallbackTolerance: 5,
          onEnd(evt) {
            const list = sortableListRef.current;
            if (!list) return;
            const newOrder = Array.from(list.children)
              .map(el => el.dataset.tagId)
              .filter(Boolean);
            if (newOrder.length === 0) return;
            try {
              reorderTagsInGroup(activeGroup, newOrder);
              reloadTags();
              window.dispatchEvent(new Event('tagsUpdated'));
              showTmToast('✓ Đã cập nhật thứ tự thẻ');
            } catch (err) {
              showTmToast('Lỗi lưu thứ tự. Vui lòng thử lại.');
            }
          },
        });
        return () => {
          if (sortableRef.current) {
            sortableRef.current.destroy();
            sortableRef.current = null;
          }
        };
      }, [activeGroup, activeTags.length]);

      function startEdit(tag) {
        setEditingId(tag.tagId);
        setEditValue(tag.tagName);
        setEditError('');
      }
      function cancelEdit() {
        setEditingId(null); setEditValue(''); setEditError('');
      }
      function confirmEdit(tagId) {
        try {
          updateTag(tagId, { tagName: editValue });
          reloadTags();
          setEditingId(null); setEditValue('');
          window.dispatchEvent(new Event('tagsUpdated'));
          showTmToast('✓ Đã cập nhật thẻ');
        } catch (err) {
          setEditError(err.message || 'Lỗi cập nhật thẻ');
        }
      }

      function handleHide(tagId) {
        try {
          hideTag(tagId); reloadTags();
          window.dispatchEvent(new Event('tagsUpdated'));
          showTmToast('Đã ẩn thẻ');
        } catch (err) { showTmToast(err.message || 'Lỗi ẩn thẻ'); }
      }
      function handleShow(tagId) {
        try {
          showTag(tagId); reloadTags();
          window.dispatchEvent(new Event('tagsUpdated'));
          showTmToast('✓ Đã hiện lại thẻ');
        } catch (err) { showTmToast(err.message || 'Lỗi hiện thẻ'); }
      }

      function handleConfirmPermDelete() {
        if (!confirmDeleteTagId) return;
        try {
          permanentDeleteTag(confirmDeleteTagId);
          reloadTags();
          setConfirmDeleteTagId(null);
          window.dispatchEvent(new Event('tagsUpdated'));
          showTmToast('Đã xóa bỏ thẻ');
        } catch (err) {
          setConfirmDeleteTagId(null);
          showTmToast(err.message || 'Lỗi xóa bỏ thẻ');
        }
      }

      function handleAdd() {
        setAddError('');
        try {
          addTag(activeGroup, newTagValue);
          reloadTags();
          setNewTagValue('');
          window.dispatchEvent(new Event('tagsUpdated'));
          showTmToast('✓ Đã thêm thẻ mới');
        } catch (err) {
          setAddError(err.message || 'Lỗi thêm thẻ');
        }
      }

      return (
        <div className="tag-manager-screen">
          <header className="page-header">
            <button className="btn-back" onClick={onBack}>←</button>
            <div style={{flex:1}}>
              <h1>Quản lý thẻ chọn nhanh</h1>
              <div className="header-subtitle">Giữ ☰ để kéo sắp xếp thứ tự</div>
            </div>
          </header>

          {/* Group tabs — chỉ hiện nhóm visible (không có hidden: true) */}
          <div className="tag-group-tabs">
            {visibleGroups.map(g => (
              <button
                key={g.id}
                className={`tag-group-tab${activeGroup === g.id ? ' active' : ''}`}
                onClick={() => switchGroup(g.id)}
              >
                {g.label}
              </button>
            ))}
          </div>

          <div className="tag-manager-body">

            {/* Active tags */}
            <div className="tag-section">
              <div className="tag-section-title">
                Đang hiển thị ({activeTags.length})
              </div>

              {activeTags.length === 0 && (
                <div className="tag-empty">Chưa có thẻ nào trong nhóm này.</div>
              )}

              <div ref={sortableListRef}>
                {activeTags.map(tag => (
                  editingId === tag.tagId ? (
                    <div key={tag.tagId} data-tag-id={tag.tagId} className="tag-edit-row">
                      <input
                        className="tag-edit-input"
                        value={editValue}
                        autoFocus
                                                onChange={e => { setEditValue(e.target.value); setEditError(''); }}
                        onKeyDown={e => {
                          if (e.key === 'Escape') cancelEdit();
                        }}
                      />
                      {editError && (
                        <div className="tag-edit-error">{editError}</div>
                      )}
                      <div className="tag-edit-btns">
                        <button className="btn-tag-confirm" onClick={() => confirmEdit(tag.tagId)}>✓ Lưu</button>
                        <button className="btn-tag-cancel"  onClick={cancelEdit}>✕</button>
                      </div>
                    </div>
                  ) : (
                    <div key={tag.tagId} data-tag-id={tag.tagId} className="tag-row">
                      <span className="tag-drag-handle">☰</span>
                      <span className="tag-name">{tag.tagName}</span>
                      <div className="tag-row-actions">
                        <button className="btn-tag-edit"   onClick={() => startEdit(tag)}>Sửa</button>
                        <button className="btn-tag-hide"   onClick={() => handleHide(tag.tagId)}>👁</button>
                        <button className="btn-tag-delete" onClick={() => setConfirmDeleteTagId(tag.tagId)}>🗑</button>
                      </div>
                    </div>
                  )
                ))}
              </div>
            </div>

            {/* Thẻ đang ẩn */}
            {hiddenTags.length > 0 && (
              <div className="tag-section">
                <button
                  className="btn-show-hidden-tags"
                  onClick={() => setShowHidden(v => !v)}
                >
                  {showHidden ? '▲' : '▼'} Đang ẩn ({hiddenTags.length})
                </button>
                {showHidden && (
                  <div style={{marginTop:6}}>
                    {hiddenTags.map(tag => (
                      <div key={tag.tagId} className="tag-row tag-row-hidden">
                        <span style={{width:24, display:'inline-block'}}></span>
                        <span className="tag-name" style={{opacity:0.5, flex:1}}>{tag.tagName}</span>
                        <div className="tag-row-actions">
                          <button className="btn-tag-show"   onClick={() => handleShow(tag.tagId)}>👁</button>
                          <button className="btn-tag-delete" onClick={() => setConfirmDeleteTagId(tag.tagId)}>🗑</button>
                        </div>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            )}

            {/* Thêm thẻ mới */}
            <div className="tag-add-form">
              <input
                className="tag-add-input form-input"
                placeholder={`Thêm thẻ ${currentGroup ? currentGroup.label : ''}...`}
                value={newTagValue}
                onChange={e => { setNewTagValue(e.target.value); setAddError(''); }}
                onKeyDown={e => { if (e.key === 'Enter') handleAdd(); }}
              />
              {addError && <div className="tag-edit-error">{addError}</div>}
              <button
                className="btn btn-primary"
                style={{marginTop:8, width:'100%'}}
                onClick={handleAdd}
              >
                + Thêm thẻ mới
              </button>
            </div>

          </div>{/* end tag-manager-body */}

          {/* Toast thông báo nhẹ */}
          {tmToast && (
            <div className="tm-toast">{tmToast}</div>
          )}

          {/* Modal xác nhận xóa bỏ thẻ */}
          {confirmDeleteTagId && (
            <div className="modal-overlay" onClick={() => setConfirmDeleteTagId(null)}>
              <div className="modal-box" onClick={e => e.stopPropagation()}>
                <div className="modal-icon">⚠️</div>
                <div className="modal-title">Xóa bỏ thẻ này?</div>
                <div className="modal-desc">
                  Thẻ sẽ bị xóa hoàn toàn và không thể khôi phục.
                </div>
                <div className="modal-btns">
                  <button className="btn btn-secondary btn-full" style={{flex:1}}
                    onClick={() => setConfirmDeleteTagId(null)}>
                    Hủy
                  </button>
                  <button className="btn btn-danger btn-full" style={{flex:1}}
                    onClick={handleConfirmPermDelete}>
                    Xóa bỏ vĩnh viễn
                  </button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    /* ─────────────────────────────────────────────
       APP — Router chính
    ───────────────────────────────────────────── */
    function App() {
      const [storageReady, setStorageReady] = useState(false);
      const [screen,             setScreen]             = useState('list');
      const [selectedProjectId,  setSelectedProjectId]  = useState(null);
      const [selectedImageId,    setSelectedImageId]    = useState(null);

      // ── P23: initStorage on mount ──────────────────────────────
      useEffect(() => {
        initStorage().then(() => {
          applyTheme(getSettings().backgroundColor);
          const initial = restoreCurrentView();
          setScreen(initial.screen);
          setSelectedProjectId(initial.selectedProjectId);
          setSelectedImageId(initial.selectedImageId);
          setStorageReady(true);
        }).catch(err => {
          console.error('[App] initStorage failed:', err);
          applyTheme('white');
          setStorageReady(true);
        });
      }, []);

      // ── Navigation history (Prompt 14.7) ──────────────────────
      const navStackRef  = React.useRef([]);
      const [navStack, setNavStackState] = useState([]);  // chỉ để trigger re-render

      function setNavStack(updater) {
        const newVal = typeof updater === 'function' ? updater(navStackRef.current) : updater;
        navStackRef.current = newVal;
        setNavStackState(newVal);
      }

      // Điều hướng trực tiếp — không đẩy vào stack (dùng nội bộ)
      function navigateDirect(s, projId, imgId) {
        setScreen(s);
        setSelectedProjectId(projId || null);
        setSelectedImageId(imgId   || null);
        saveCurrentView({
          screen:            s,
          selectedProjectId: projId || null,
          selectedImageId:   imgId  || null,
        });
      }

      // Điều hướng tiến — đẩy màn hình hiện tại vào stack trước
      function goTo(newScreen, projectId, imageId) {
        const currentEntry = { screen, selectedProjectId, selectedImageId };
        const stack = navStackRef.current;
        const top   = stack[stack.length - 1];
        const isDup = top &&
                      top.screen              === currentEntry.screen &&
                      top.selectedProjectId   === currentEntry.selectedProjectId &&
                      top.selectedImageId     === currentEntry.selectedImageId;
        if (!isDup) setNavStack([...stack, currentEntry]);
        navigateDirect(newScreen, projectId, imageId);
      }

      // Back — quay lại màn hình gần nhất trong stack
      function handleBack() {
        const stack = navStackRef.current;
        if (stack.length === 0) {
          if (screen !== 'list') navigateDirect('list', null, null);
          return;
        }
        const prev     = stack[stack.length - 1];
        const newStack = stack.slice(0, -1);
        navStackRef.current = newStack;
        setNavStackState(newStack);
        navigateDirect(prev.screen, prev.selectedProjectId, prev.selectedImageId);
      }

      // ── Swipe right to back ────────────────────────────────────
      useEffect(() => {
        let sx = 0, sy = 0;
        function onTouchStart(e) {
          // Không kích hoạt khi đang nhập liệu
          const tag = e.target.tagName;
          if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
          // Không kích hoạt khi modal đang mở
          if (document.querySelector('.modal-overlay')) return;
          // Không kích hoạt khi đang ở chế độ chọn ảnh (tránh xung đột drag-select)
          if (e.target.closest('[data-selecting="true"]')) return;
          sx = e.touches[0].clientX;
          sy = e.touches[0].clientY;
        }
        function onTouchEnd(e) {
          const dx = e.changedTouches[0].clientX - sx;
          const dy = e.changedTouches[0].clientY - sy;
          // Trượt phải đủ rõ và ngang hơn dọc
          if (dx > 80 && Math.abs(dx) > Math.abs(dy) * 1.5) {
            handleBackRef.current();
          }
        }
        document.addEventListener('touchstart', onTouchStart, { passive: true });
        document.addEventListener('touchend',   onTouchEnd,   { passive: true });
        return () => {
          document.removeEventListener('touchstart', onTouchStart);
          document.removeEventListener('touchend',   onTouchEnd);
        };
      }, []);  // đăng ký một lần, dùng ref để luôn có handleBack mới nhất

      // Ref để swipe handler luôn có handleBack mới nhất (tránh stale closure)
      const handleBackRef = React.useRef(handleBack);
      useEffect(() => { handleBackRef.current = handleBack; });

      if (!storageReady) return (
        <div style={{ display:'flex', justifyContent:'center', alignItems:'center', height:'100vh', fontFamily:'Arial,sans-serif', fontSize:'16px', color:'#1f2937', background:'#f9fafb' }}>
          <div style={{ textAlign:'center' }}>
            <div style={{ fontSize:'28px', marginBottom:'12px' }}>⏳</div>
            <div>Đang tải dữ liệu...</div>
          </div>
        </div>
      );

      if (screen === 'create') {
        return (
          <ProjectForm
            onBack={handleBack}
            onSaved={proj => goTo('detail', proj.projectId)}
          />
        );
      }

      if (screen === 'detail' && selectedProjectId) {
        return (
          <ProjectDetail
            projectId={selectedProjectId}
            onBack={handleBack}
            onSelectImage={imgId => goTo('image-detail', selectedProjectId, imgId)}
            onOpenTagManager={() => goTo('tag-manager')}
          />
        );
      }

      if (screen === 'image-detail' && selectedProjectId && selectedImageId) {
        return (
          <ImageDetail
            imageId={selectedImageId}
            projectId={selectedProjectId}
            onBack={handleBack}
          />
        );
      }

      if (screen === 'trash') {
        return <TrashScreen onBack={handleBack} />;
      }

      if (screen === 'tag-manager') {
        return (
          <TagManager
            onBack={handleBack}
          />
        );
      }

      if (screen === 'settings') {
        return <SettingsScreen onBack={handleBack} />;
      }

      // Mặc định: màn hình danh sách công trình
      return (
        <ProjectList
          onCreateNew={() => goTo("create")}
          onSelectProject={projId => goTo("detail", projId)}
          onOpenTagManager={() => goTo("tag-manager")}
          onOpenSettings={() => goTo("settings")}
          onOpenTrash={() => goTo("trash")}
        />
      );
    }

    // ── Mount ─────────────────────────────────────────────────
    const rootEl = document.getElementById("root");
    ReactDOM.createRoot(rootEl).render(<App />);
  </script>
</body>
</html>
