    const EMPTY_FORM = {
      status: 'survey',
      // Mảng chọn nhiều có thứ tự (Prompt 9.6)
      positions: [], curtainTypes: [], productSpecs: [],
      // Giữ lại field cũ để backward compat với localStorage cũ
      position: '', area: '', curtainType: '',
      productSpec: '', usageSpec: '', installationSpec: '',
      width: '', height: '', unit: 'mm',
      notes: '', tags: [],
    };


    /* ── Annotation helpers (P30) ── */
    function annArrowPts(x1,y1,x2,y2,s) {
      var dx=x2-x1,dy=y2-y1,len=Math.sqrt(dx*dx+dy*dy);
      if(len<0.001) return '';
      var ux=dx/len,uy=dy/len,px=-uy,py=ux,ss=s*0.45;
      return x2+','+y2+' '+(x2-ux*s+px*ss)+','+(y2-uy*s+py*ss)+' '+(x2-ux*s-px*ss)+','+(y2-uy*s-py*ss);
    }
    function annVec(x1,y1,x2,y2){
      var dx=x2-x1,dy=y2-y1,len=Math.sqrt(dx*dx+dy*dy);
      return len<0.001?{ux:0,uy:0,len:0}:{ux:dx/len,uy:dy/len,len:len};
    }
    function drawCanvasArrowHead(ctx,x1,y1,x2,y2,size) {
      var dx=x2-x1,dy=y2-y1,len=Math.sqrt(dx*dx+dy*dy);
      if(len<0.001) return;
      var ux=dx/len,uy=dy/len,px=-uy,py=ux,ss=size*0.45;
      ctx.fillStyle='#ef4444';
      ctx.beginPath(); ctx.moveTo(x2,y2);
      ctx.lineTo(x2-ux*size+px*ss,y2-uy*size+py*ss);
      ctx.lineTo(x2-ux*size-px*ss,y2-uy*size-py*ss);
      ctx.closePath(); ctx.fill();
    }
    function ptLineDist(px,py,x1,y1,x2,y2){
      var dx=x2-x1,dy=y2-y1,len2=dx*dx+dy*dy;
      if(len2<0.001) return Math.sqrt((px-x1)*(px-x1)+(py-y1)*(py-y1));
      var t=Math.max(0,Math.min(1,((px-x1)*dx+(py-y1)*dy)/len2));
      return Math.sqrt((px-x1-t*dx)*(px-x1-t*dx)+(py-y1-t*dy)*(py-y1-t*dy));
    }

    function AnnotationEditor({ imageUrl, initialAnnotations, onSave, onCancel }) {
      const [anns, setAnns]       = useState(initialAnnotations || []);
      const [tool, setTool]       = useState('arrow');
      const [drawStart, setDS]    = useState(null);
      const [drawCur,   setDC]    = useState(null);
      const [selId, setSelId]     = useState(null);
      // drag: move whole object
      const [dragId, setDragId]   = useState(null);
      // rotate: one end of arrow is fixed, other follows pointer
      const [rotState, setRot]    = useState(null); // {annId, movingKey:'x1y1'|'x2y2'}
      // inline text edit
      const [inlinePos, setIP]    = useState(null);
      const [inlineVal, setIV]    = useState('');
      const [editingId, setEId]   = useState(null);
      const svgRef      = React.useRef(null);
      const dragRef     = React.useRef(null);
      const inlineRef   = React.useRef(null);
      const annsRef     = React.useRef(anns); annsRef.current = anns;
      const lastTapRef  = React.useRef({time:0,id:null});
      // Prevent browser swipe-back during annotation drag
      React.useEffect(function(){
        var el = svgRef.current; if(!el) return;
        function noScroll(e){ e.preventDefault(); }
        el.addEventListener("touchstart", noScroll, {passive:false});
        el.addEventListener("touchmove",  noScroll, {passive:false});
        return function(){ el.removeEventListener("touchstart",noScroll); el.removeEventListener("touchmove",noScroll); };
      }, []); // double-tap tracking

      function toPct(e) {
        var svg=svgRef.current; if(!svg) return {x:0,y:0,sx:0,sy:0};
        var r=svg.getBoundingClientRect();
        var s=e.touches?e.touches[0]:(e.changedTouches?e.changedTouches[0]:e);
        return {
          x:Math.max(0,Math.min(100,(s.clientX-r.left)/r.width*100)),
          y:Math.max(0,Math.min(100,(s.clientY-r.top)/r.height*100)),
          sx:s.clientX, sy:s.clientY,
        };
      }
      function annToScreen(ax,ay){
        var svg=svgRef.current; if(!svg) return {sx:0,sy:0};
        var r=svg.getBoundingClientRect();
        return {sx:r.left+ax/100*r.width, sy:r.top+ay/100*r.height};
      }
      function hitTest(pt){
        for(var i=annsRef.current.length-1;i>=0;i--){
          var a=annsRef.current[i];
          if(a.type==='text'&&Math.abs(pt.x-a.x)<14&&Math.abs(pt.y-a.y)<5) return a.id;
          if(a.type==='arrow'&&ptLineDist(pt.x,pt.y,a.x1,a.y1,a.x2,a.y2)<5) return a.id;
        }
        return null;
      }
      function openInline(pos,val,editId){
        setIP(pos); setIV(val||''); setEId(editId||null);
        setTimeout(function(){if(inlineRef.current){inlineRef.current.focus();inlineRef.current.select();}},30);
      }
      function confirmText(){
        var val=inlineVal.trim();
        if(inlinePos&&val){
          if(editingId){
            setAnns(function(p){return p.map(function(a){return a.id===editingId?{...a,text:val}:a;});});
          } else {
            var id=Date.now().toString(36)+Math.random().toString(36).slice(2,5);
            setAnns(function(p){return p.concat([{id,type:'text',x:inlinePos.x,y:inlinePos.y,text:val}]);});
          }
        }
        setIP(null); setIV(''); setEId(null);
      }
      function onDown(e){
        e.preventDefault();
        var pt=toPct(e);
        if(inlinePos){confirmText();return;}
        var hit=hitTest(pt);
        if(hit){
          var ann=annsRef.current.find(function(a){return a.id===hit;});
          var now=Date.now();
          var isDouble=(now-lastTapRef.current.time<350)&&lastTapRef.current.id===hit;
          lastTapRef.current={time:now,id:hit};
          setSelId(hit);
          if(ann.type==='text'){
            if(isDouble){
              // Double tap → edit
              var sc=annToScreen(ann.x,ann.y);
              openInline({x:ann.x,y:ann.y,sx:sc.sx,sy:sc.sy},ann.text,hit);
            } else {
              // Single tap → drag
              setDragId(hit);
              dragRef.current={startPt:pt,startAnn:{...ann}};
            }
            return;
          }
          if(ann.type==='arrow'){
            // Check if near endpoint (within 8 units)
            var d1=Math.sqrt((pt.x-ann.x1)*(pt.x-ann.x1)+(pt.y-ann.y1)*(pt.y-ann.y1));
            var d2=Math.sqrt((pt.x-ann.x2)*(pt.x-ann.x2)+(pt.y-ann.y2)*(pt.y-ann.y2));
            if(Math.min(d1,d2)<9){
              // Near arrowhead → rotate mode
              setRot({annId:hit, movingKey:d1<d2?'x1y1':'x2y2'});
            } else {
              // Middle of line → drag whole arrow
              setDragId(hit);
              dragRef.current={startPt:pt,startAnn:{...ann}};
            }
            return;
          }
          return;
        }
        setSelId(null);
        lastTapRef.current={time:0,id:null};
        if(tool==='arrow'){setDS(pt);setDC(pt);}
        else if(tool==='text'){openInline({x:pt.x,y:pt.y,sx:pt.sx,sy:pt.sy},'',null);}
      }
      function onMove(e){
        e.preventDefault();
        var pt=toPct(e);
        if(rotState){
          setAnns(function(p){return p.map(function(a){
            if(a.id!==rotState.annId) return a;
            if(rotState.movingKey==='x1y1') return {...a,x1:pt.x,y1:pt.y};
            return {...a,x2:pt.x,y2:pt.y};
          });});
          return;
        }
        if(dragId&&dragRef.current){
          var dx=pt.x-dragRef.current.startPt.x,dy=pt.y-dragRef.current.startPt.y;
          var sa=dragRef.current.startAnn;
          setAnns(function(p){return p.map(function(a){
            if(a.id!==dragId) return a;
            if(a.type==='arrow') return {...a,x1:sa.x1+dx,y1:sa.y1+dy,x2:sa.x2+dx,y2:sa.y2+dy};
            if(a.type==='text')  return {...a,x:sa.x+dx,y:sa.y+dy};
            return a;
          });});
          return;
        }
        if(!drawStart) return;
        setDC(pt);
      }
      function onUp(e){
        e.preventDefault();
        if(rotState){setRot(null);return;}
        if(dragId){setDragId(null);dragRef.current=null;return;}
        if(!drawStart) return;
        var pt=toPct(e);
        var dx=pt.x-drawStart.x,dy=pt.y-drawStart.y;
        if(Math.sqrt(dx*dx+dy*dy)>2){
          var id=Date.now().toString(36)+Math.random().toString(36).slice(2,5);
          setAnns(function(p){return p.concat([{id,type:'arrow',x1:drawStart.x,y1:drawStart.y,x2:pt.x,y2:pt.y,twoHeads:true}]);});
        }
        setDS(null);setDC(null);
      }
      function delSel(){setAnns(function(p){return p.filter(function(a){return a.id!==selId;});});setSelId(null);}
      function toggleHeads(){setAnns(function(p){return p.map(function(a){return a.id===selId?{...a,twoHeads:!a.twoHeads}:a;});});}
      var selAnn_=anns.find(function(a){return a.id===selId;});
      const S=2.0;
      // Status hint
      var hint = rotState ? '🔄 Đang xoay — nhấc ngón tay để dừng' :
                 dragId   ? '✥ Đang di chuyển...' :
                 inlinePos? 'Nhập xong → Enter hoặc bấm ra ngoài' :
                 tool==='arrow'
                   ? (selAnn_&&selAnn_.type==='arrow'
                       ? 'Bấm đầu mũi để xoay • Bấm giữa để kéo • 🗑 xóa'
                       : 'Kéo để vẽ mũi tên')
                   : 'Bấm để đặt • Kéo để di chuyển • Chạm 2× để sửa';
      return (
        <div className="ann-editor-overlay">
          <div className="ann-editor-img-wrap">
            <img src={imageUrl} className="ann-editor-img" draggable={false}/>
            <svg ref={svgRef} className="ann-svg-overlay" viewBox="0 0 100 100" preserveAspectRatio="none"
              onPointerDown={onDown} onPointerMove={onMove} onPointerUp={onUp}
            >
              {anns.map(function(ann){
                var sel=(ann.id===selId)&&!editingId;
                var isRot=rotState&&rotState.annId===ann.id;
                var clr=(sel||isRot)?'#ff8800':'#ef4444';
                if(ann.type==='arrow'){
                  var v=annVec(ann.x1,ann.y1,ann.x2,ann.y2);
                  if(v.len<0.001) return null;
                  var lx1=ann.x1+(ann.twoHeads?v.ux*S:0), ly1=ann.y1+(ann.twoHeads?v.uy*S:0);
                  var lx2=ann.x2-v.ux*S, ly2=ann.y2-v.uy*S;
                  var p2=annArrowPts(ann.x1,ann.y1,ann.x2,ann.y2,S);
                  var p1=ann.twoHeads?annArrowPts(ann.x2,ann.y2,ann.x1,ann.y1,S):null;
                  // Rotating endpoint dot
                  var rotDot=isRot?(rotState.movingKey==='x1y1'
                    ?{cx:ann.x1,cy:ann.y1}:{cx:ann.x2,cy:ann.y2}):null;
                  return (<g key={ann.id}>
                    <line x1={lx1} y1={ly1} x2={lx2} y2={ly2} stroke={clr} strokeWidth="0.5"/>
                    <polygon points={p2} fill={clr}/>
                    {p1&&<polygon points={p1} fill={clr}/>}
                    {/* hit area */}
                    <line x1={ann.x1} y1={ann.y1} x2={ann.x2} y2={ann.y2} stroke="transparent" strokeWidth="6"/>
                    {/* endpoint handles when selected */}
                    {(sel||isRot)&&<>
                      <circle cx={ann.x1} cy={ann.y1} r="2.2" fill="rgba(0,0,0,0.5)" stroke="#fff" strokeWidth="0.5"/>
                      <circle cx={ann.x2} cy={ann.y2} r="2.2" fill="rgba(0,0,0,0.5)" stroke="#fff" strokeWidth="0.5"/>
                    </>}
                    {/* spinning dot highlight */}
                    {rotDot&&<circle cx={rotDot.cx} cy={rotDot.cy} r="2.8" fill="#ff8800" stroke="#fff" strokeWidth="0.5"/>}
                  </g>);
                }
                if(ann.type==='text'){
                  if(ann.id===editingId) return null;
                  var tw=ann.text.length*2.4+4; var bh=5.5; var cx2=ann.x+tw/2;
                  return (<g key={ann.id}>
                    <rect x={ann.x} y={ann.y-bh/2} width={tw} height={bh} rx="1.5" ry="1.5"
                      fill={sel?'rgba(255,136,0,0.75)':'rgba(50,50,50,0.82)'}/>
                    <text x={cx2} y={ann.y} textAnchor="middle" dominantBaseline="central"
                      fontSize="3.5" fontWeight="bold" fontFamily="Arial" fill={sel?'#fff':'#ef4444'}>
                      {ann.text}
                    </text>
                    <rect x={ann.x} y={ann.y-bh/2} width={tw} height={bh} fill="transparent"/>
                  </g>);
                }
                return null;
              })}
              {drawStart&&drawCur&&<line x1={drawStart.x} y1={drawStart.y} x2={drawCur.x} y2={drawCur.y}
                stroke="#ef4444" strokeWidth="0.5" strokeDasharray="2,1.5"/>}
            </svg>
            {inlinePos&&(
              <div style={{position:'fixed',left:inlinePos.sx,top:inlinePos.sy,
                transform:'translate(-50%,-130%)',zIndex:400,pointerEvents:'auto'}}>
                <input ref={inlineRef} value={inlineVal}
                  onChange={function(e){setIV(e.target.value);}}
                  onKeyDown={function(e){
                    if(e.key==='Enter'){e.preventDefault();confirmText();}
                    if(e.key==='Escape'){setIP(null);setIV('');setEId(null);}
                  }}
                  onBlur={confirmText}
                  style={{
                    background:'rgba(20,20,20,0.92)',color:'#ef4444',
                    border:'1.5px solid rgba(239,68,68,0.6)',borderRadius:8,
                    padding:'6px 14px',fontSize:17,fontFamily:'Arial',
                    fontWeight:'bold',outline:'none',minWidth:90,textAlign:'center',
                    boxShadow:'0 2px 12px rgba(0,0,0,0.5)',
                  }}
                  placeholder="..."
                />
              </div>
            )}
          </div>

          {/* Toolbar */}
          <div style={{
            background:'var(--bg-card)',borderTop:'1px solid var(--border)',
            padding:'10px 12px',display:'flex',gap:8,flexWrap:'wrap',alignItems:'center',
          }}>
            <div style={{
              color: rotState?'#ef4444':'var(--text-secondary)',
              fontSize:11,width:'100%',marginBottom:2,lineHeight:1.3,
              fontWeight: rotState?'700':'400',
            }}>{hint}</div>
            <button style={{
                flex:1,padding:'9px 0',borderRadius:8,border:'1.5px solid var(--border)',
                background:tool==='arrow'?'var(--primary)':'var(--bg-card)',
                color:tool==='arrow'?'#fff':'var(--text)',fontSize:18,cursor:'pointer',lineHeight:1,
              }}
              onClick={function(){setTool('arrow');setSelId(null);}}>↔</button>
            <button style={{
                flex:1,padding:'9px 0',borderRadius:8,border:'1.5px solid var(--border)',
                background:tool==='text'?'var(--primary)':'var(--bg-card)',
                color:tool==='text'?'#fff':'var(--text)',
                fontSize:16,fontWeight:'bold',fontFamily:'Arial',cursor:'pointer',lineHeight:1,
              }}
              onClick={function(){setTool('text');setSelId(null);}}>
              T<sup style={{fontSize:'0.6em',fontWeight:'bold'}}>+</sup>
            </button>
            {selAnn_&&selAnn_.type==='arrow'&&(
              <button className="btn btn-secondary" style={{flex:1.5}} onClick={toggleHeads}>
                {selAnn_.twoHeads?'→ 1 đầu':'↔ 2 đầu'}
              </button>
            )}
            {selId&&<button className="btn btn-secondary" style={{flex:1,color:'var(--danger)'}} onClick={delSel}>🗑</button>}
            <button className="btn btn-primary" style={{flex:2}} onClick={function(){onSave(anns);}}>← Xong</button>
          </div>
        </div>
      );
    }

    function ImageDetail({ imageId, projectId, onBack }) {
      const [image, setImage]       = useState(null);
      const [notFound, setNotFound] = useState(false);
      const [form, setForm]         = useState({...EMPTY_FORM});
      const [saving, setSaving]     = useState(false);
      const [saved, setSaved]       = useState(false);       // flash success
      const [pendingPreview, setPendingPreview] = useState(null); // ảnh mới chưa lưu
      const [replacing, setReplacing]           = useState(false); // đang nén ảnh
      // tagVersion: tăng khi nhận tagsUpdated event → buộc re-render, đọc lại getTagsByGroup()
      const [tagVersion, setTagVersion] = useState(0);
      const replaceInputRef = React.useRef(null);
      const [annotations, setAnnotations] = useState([]);
      const [annEditorOpen, setAnnEditorOpen] = useState(false);
      const [collSections, setCollSections]   = useState(new Set());
      function toggleColl(name){ setCollSections(function(prev){
        var s=new Set(prev); s.has(name)?s.delete(name):s.add(name); return s;
      }); }

      // Load ảnh + điền sẵn form
      useEffect(() => {
        const img = getImageById(imageId);
        if (!img) {
          storageLog('ERROR', 'image-detail', 'ImageDetail mount',
            'Không tìm thấy ảnh', `imageId: ${imageId}`);
          setNotFound(true);
          return;
        }
        setImage(img);
        setForm({
          status:           img.status           || 'survey',
          // Mảng mới — backward compat: nếu chưa có mảng, dùng field cũ (single) để migrate
          positions:    Array.isArray(img.positions)    ? [...img.positions]    : (img.position    ? [img.position]    : []),
          curtainTypes: Array.isArray(img.curtainTypes) ? [...img.curtainTypes] : (img.curtainType ? [img.curtainType] : []),
          productSpecs: Array.isArray(img.productSpecs) ? [...img.productSpecs] : (img.productSpec ? [img.productSpec] : []),
          // Field cũ — giữ để không mất dữ liệu
          position:         img.position         || '',
          area:             img.area             || '',
          curtainType:      img.curtainType      || '',
          productSpec:      img.productSpec      || '',
          usageSpec:        img.usageSpec        || '',
          installationSpec: img.installationSpec || '',
          width:            img.width            || '',
          height:      img.height      || '',
          unit:        img.unit        || 'mm',
          notes:       img.notes       || '',
          tags:        Array.isArray(img.tags) ? [...img.tags] : [],
        });
        setAnnotations(Array.isArray(img.annotations) ? [...img.annotations] : []);
      }, [imageId]);

      // Lắng nghe tagsUpdated → force re-render để getTagsByGroup() đọc lại localStorage
      useEffect(() => {
        const onTagsUpdated = () => setTagVersion(v => v + 1);
        window.addEventListener('tagsUpdated', onTagsUpdated);
        return () => window.removeEventListener('tagsUpdated', onTagsUpdated);
      }, []);

      /* --- Chọn chip single-select --- */
      function handleSingleChip(groupId, value) {
        setForm(prev => ({
          ...prev,
          [groupId]: prev[groupId] === value ? '' : value, // bấm lại → bỏ chọn
        }));
      }

      /* --- Chọn chip multi-select (tags) --- */
      function handleMultiChip(value) {
        setForm(prev => {
          const tags = prev.tags.includes(value)
            ? prev.tags.filter(t => t !== value)
            : [...prev.tags, value];
          return { ...prev, tags };
        });
      }

      /* --- Chọn chip ordered multi-select (positions, curtainTypes, productSpecs) --- */
      function handleOrderedMultiChip(fieldName, value) {
        setForm(prev => {
          const arr = prev[fieldName];
          if (arr.includes(value)) {
            // Bấm lại → bỏ chọn
            return { ...prev, [fieldName]: arr.filter(v => v !== value) };
          }
          // Thêm vào cuối danh sách
          return { ...prev, [fieldName]: [...arr, value] };
        });
      }

      /* --- Nhập số kích thước --- */
      function handleSizeInput(e) {
        const { name, value } = e.target;
        // Chỉ cho nhập số và dấu chấm/phẩy
        const clean = value.replace(/[^\d.,]/g, '');
        setForm(prev => ({ ...prev, [name]: clean }));
      }

      /* --- Chọn ảnh thay thế --- */
      async function handleReplaceFile(e) {
        const file = e.target.files && e.target.files[0];
        // Reset input để cho phép chọn lại cùng file nếu cần
        if (replaceInputRef.current) replaceInputRef.current.value = '';
        if (!file) return; // người dùng hủy chọn → giữ nguyên ảnh cũ
        setReplacing(true);
        try {
          const dataUrl = await compressImage(file);
          setPendingPreview(dataUrl);
        } catch (err) {
          storageLog('ERROR', 'image-detail', 'handleReplaceFile()',
            'Lỗi đọc/nén ảnh mới', formatError(err));
          alert('Không đọc được ảnh. Vui lòng thử lại.');
        } finally {
          setReplacing(false);
        }
      }

      /* --- Lưu thông tin (+ ảnh mới nếu có pendingPreview) --- */
      function handleSave() {
        setSaving(true);
        try {
          const updates = {
            status:           form.status || 'survey',
            // Mảng mới (Prompt 9.6)
            positions:    form.positions,
            curtainTypes: form.curtainTypes,
            productSpecs: form.productSpecs,
            // Field cũ — giữ nguyên để không phá dữ liệu cũ
            position:         form.position,
            area:             form.area,
            curtainType:      form.curtainType,
            productSpec:      form.productSpec,
            usageSpec:        form.usageSpec,
            installationSpec: form.installationSpec,
            width:            form.width,
            height:      form.height,
            unit:        form.unit || 'mm',
            notes:       form.notes,
            tags:        form.tags,
            annotations: annotations,
          };
          // Chỉ thay imagePreviewUrl khi người dùng đã chọn ảnh mới
          if (pendingPreview) {
            updates.imagePreviewUrl = pendingPreview;
            storageLog('INFO', 'image-detail', 'handleSave()',
              `Thay ảnh cho imageId: ${imageId}`, `projectId: ${projectId}`);
          }
          updateImageInfo(imageId, updates);
          window.dispatchEvent(new Event('imagesUpdated'));
          setSaved(true);
          setTimeout(() => {
            onBack();
          }, 600);
        } catch (err) {
          const isQuota = err instanceof DOMException &&
            (err.code === 22 || err.name === 'QuotaExceededError' || err.name === 'NS_ERROR_DOM_QUOTA_REACHED');
          storageLog('ERROR', 'image-detail', 'handleSave()',
            isQuota ? 'localStorage đã đầy khi lưu ảnh mới' : 'Lỗi lưu thông tin ảnh',
            formatError(err));
          alert(isQuota
            ? 'Bộ nhớ trình duyệt đã đầy. Vui lòng xóa bớt ảnh cũ hoặc xóa cache.'
            : 'Lỗi lưu thông tin. Vui lòng thử lại.');
        } finally {
          setSaving(false);
        }
      }

      /* --- Not found --- */
      if (notFound) {
        return (
          <div className="app-container">
            <header className="page-header">
              <button className="btn-back" onClick={onBack}>‹</button>
              <h1>Thông tin ảnh</h1>
            </header>
            <div className="not-found-screen">
              
              <div style={{fontSize:'17px', fontWeight:700}}>Không tìm thấy ảnh</div>
              <div style={{fontSize:'14px', color:'var(--text-secondary)'}}>
                Ảnh này có thể đã bị xóa hoặc dữ liệu bị lỗi.
              </div>
              <button className="btn btn-primary" style={{marginTop:8}} onClick={onBack}>
                ← Quay lại
              </button>
            </div>
          </div>
        );
      }

      if (!image) {
        return (
          <div className="app-container">
            <header className="page-header">
              <button className="btn-back" onClick={onBack}>‹</button>
              <h1>Thông tin ảnh</h1>
            </header>
            <div className="empty-state">
              <div style={{fontSize:'28px'}}>⏳</div><div>Đang tải...</div>
            </div>
          </div>
        );
      }

      return (
        <div className="app-container">
          {/* Header */}
          <header className="page-header">
            <button className="btn-back" onClick={onBack} disabled={saving}>‹</button>
            <h1>Gắn thông tin ảnh</h1>
          </header>

          {/* Ảnh lớn — hiển thị pendingPreview nếu đã chọn ảnh mới */}
          <div className="image-detail-preview-wrap">
            <img
              src={pendingPreview || image.imagePreviewUrl}
              alt="Ảnh khảo sát"
              className="image-detail-preview"
            />
            {pendingPreview && (
              <span className="preview-changed-badge">Ảnh mới (chưa lưu)</span>
            )}
            {annotations.length > 0 && (
              <svg className="ann-readonly-svg" viewBox="0 0 100 100" preserveAspectRatio="none">
                {annotations.map(function(ann){
                  const RS=2.0;
                  if (ann.type==='arrow') {
                    const v=annVec(ann.x1,ann.y1,ann.x2,ann.y2);
                    if(v.len<0.001) return null;
                    const lx1=ann.x1+(ann.twoHeads?v.ux*RS:0), ly1=ann.y1+(ann.twoHeads?v.uy*RS:0);
                    const lx2=ann.x2-v.ux*RS, ly2=ann.y2-v.uy*RS;
                    const p2=annArrowPts(ann.x1,ann.y1,ann.x2,ann.y2,RS);
                    const p1=ann.twoHeads?annArrowPts(ann.x2,ann.y2,ann.x1,ann.y1,RS):null;
                    return (<g key={ann.id}>
                      <line x1={lx1} y1={ly1} x2={lx2} y2={ly2} stroke="#ef4444" strokeWidth="0.5"/>
                      <polygon points={p2} fill="#ef4444"/>
                      {p1&&<polygon points={p1} fill="#ef4444"/>}
                    </g>);
                  }
                  if (ann.type==='text') {
                    const tw=ann.text.length*2.4+4, bh=5.5, cx=ann.x+tw/2;
                    return (<g key={ann.id}>
                      <rect x={ann.x} y={ann.y-bh/2} width={tw} height={bh} rx="1.5" ry="1.5" fill="rgba(50,50,50,0.82)"/>
                      <text x={cx} y={ann.y} textAnchor="middle" dominantBaseline="central"
                        fontSize="3.5" fontWeight="bold" fontFamily="Arial" fill="#ef4444">
                        {ann.text}
                      </text>
                    </g>);
                  }
                  return null;
                })}
              </svg>
            )}
          </div>

          {/* Nút Thay ảnh + Chú thích */}
          <input
            ref={replaceInputRef}
            type="file"
            accept="image/*"
            capture="environment"
            style={{display:'none'}}
            onChange={handleReplaceFile}
          />
          <div style={{display:'flex'}}>
            <button
              className="btn-replace-photo"
              type="button"
              style={{flex:1}}
              disabled={replacing || saving}
              onClick={() => replaceInputRef.current && replaceInputRef.current.click()}
            >
              {replacing ? 'Đang xử lý ảnh...' : 'Thay ảnh'}
            </button>
            <button
              className="btn-replace-photo"
              type="button"
              style={{flex:1, borderLeft:'1px solid var(--border)', color:'#ef4444', borderColor:'#ef4444'}}
              disabled={saving}
              onClick={() => setAnnEditorOpen(true)}
            >
              ✏️ Chú thích{annotations.length>0?' ('+annotations.length+')':''}
            </button>
          </div>

          {/* Form */}
          <div className="image-detail-form">

            {/* ── Tình trạng ── */}
            <div className="idf-section">
              <div className="idf-section-title">Tình trạng</div>
              <div className="chip-group">
                <div className="chips-wrap">
                  <button
                    type="button"
                    className={`chip chip-status-survey${form.status === 'survey' ? ' chip-active' : ''}`}
                    onClick={() => setForm(prev => ({...prev, status: 'survey'}))}
                  >
                    {form.status === 'survey' && <span style={{marginRight:4}}>✓</span>}
                    Khảo sát
                  </button>
                  <button
                    type="button"
                    className={`chip chip-status-production${form.status === 'production' ? ' chip-active' : ''}`}
                    onClick={() => setForm(prev => ({...prev, status: 'production'}))}
                  >
                    {form.status === 'production' && <span style={{marginRight:4}}>✓</span>}
                    Sản xuất
                  </button>
                </div>
              </div>
            </div>

            {/* ── Vị trí (ordered multi-select) ── */}
            <div className="idf-section">
              <div className="idf-section-title" style={{display:'flex',alignItems:'center',justifyContent:'space-between',cursor:'pointer'}}
                onClick={()=>toggleColl('viTri')}>
                <span>Vị trí <span className="idf-hint">Chọn nhiều, theo thứ tự</span></span>
                <span style={{fontSize:11,color:'var(--text-secondary)'}}>{collSections.has('viTri')?'▶ Mở':'▼ Thu'}</span>
              </div>
              {!collSections.has('viTri') && <div className="chip-group">
                <div className="chips-wrap">
                  {getTagsByGroup('position').map(tag => {
                    const idx = form.positions.indexOf(tag.tagName);
                    const selected = idx !== -1;
                    return (
                      <button
                        key={tag.tagId}
                        type="button"
                        className={`chip${selected ? ' chip-multi-active' : ''}`}
                        onClick={() => handleOrderedMultiChip('positions', tag.tagName)}
                      >
                        {selected && <span className="chip-order-badge">{idx + 1}</span>}
                        {tag.tagName}
                      </button>
                    );
                  })}
                </div>
              </div>}
            </div>

            {/* ── Loại rèm (ordered multi-select) ── */}
            <div className="idf-section">
              <div className="idf-section-title" style={{display:'flex',alignItems:'center',justifyContent:'space-between',cursor:'pointer'}}
                onClick={()=>toggleColl('loaiRem')}>
                <span>Loại rèm <span className="idf-hint">Chọn nhiều, theo thứ tự</span></span>
                <span style={{fontSize:11,color:'var(--text-secondary)'}}>{collSections.has('loaiRem')?'▶ Mở':'▼ Thu'}</span>
              </div>
              {!collSections.has('loaiRem') && <div className="chip-group">
                <div className="chips-wrap">
                  {getTagsByGroup('curtainType').map(tag => {
                    const idx = form.curtainTypes.indexOf(tag.tagName);
                    const selected = idx !== -1;
                    return (
                      <button
                        key={tag.tagId}
                        type="button"
                        className={`chip${selected ? ' chip-multi-active' : ''}`}
                        onClick={() => handleOrderedMultiChip('curtainTypes', tag.tagName)}
                      >
                        {selected && <span className="chip-order-badge">{idx + 1}</span>}
                        {tag.tagName}
                      </button>
                    );
                  })}
                </div>
              </div>}
            </div>

            {/* ── Quy cách sản phẩm (ordered multi-select) ── */}
            <div className="idf-section">
              <div className="idf-section-title" style={{display:'flex',alignItems:'center',justifyContent:'space-between',cursor:'pointer'}}
                onClick={()=>toggleColl('quyCach')}>
                <span>Quy cách sản phẩm <span className="idf-hint">Chọn nhiều, theo thứ tự</span></span>
                <span style={{fontSize:11,color:'var(--text-secondary)'}}>{collSections.has('quyCach')?'▶ Mở':'▼ Thu'}</span>
              </div>
              {!collSections.has('quyCach') && <div className="chip-group">
                <div className="chips-wrap">
                  {getTagsByGroup('productSpec').map(tag => {
                    const idx = form.productSpecs.indexOf(tag.tagName);
                    const selected = idx !== -1;
                    return (
                      <button
                        key={tag.tagId}
                        type="button"
                        className={`chip${selected ? ' chip-multi-active' : ''}`}
                        onClick={() => handleOrderedMultiChip('productSpecs', tag.tagName)}
                      >
                        {selected && <span className="chip-order-badge">{idx + 1}</span>}
                        {tag.tagName}
                      </button>
                    );
                  })}
                </div>
              </div>}
            </div>

            {/* ── Lưu ý (ordered multi-select) ── */}
            {HASHTAG_GROUPS.filter(g => g.multi).map(group => (
              <div key={group.id} className="idf-section">
                <div className="idf-section-title" style={{display:'flex',alignItems:'center',justifyContent:'space-between',cursor:'pointer'}}
                  onClick={()=>toggleColl('luuY_'+group.id)}>
                  <span>⚠️ {group.label} <span className="idf-hint">Chọn nhiều, theo thứ tự</span></span>
                  <span style={{fontSize:11,color:'var(--text-secondary)'}}>{collSections.has('luuY_'+group.id)?'▶ Mở':'▼ Thu'}</span>
                </div>
                {!collSections.has('luuY_'+group.id) && <div className="chip-group">
                  <div className="chips-wrap">
                    {getTagsByGroup(group.id).map(tag => {
                      const idx = form.tags.indexOf(tag.tagName);
                      const selected = idx !== -1;
                      return (
                        <button
                          key={tag.tagId}
                          type="button"
                          className={`chip${selected ? ' chip-multi-active' : ''}`}
                          onClick={() => handleOrderedMultiChip('tags', tag.tagName)}
                        >
                          {selected && <span className="chip-order-badge">{idx + 1}</span>}
                          {tag.tagName}
                        </button>
                      );
                    })}
                  </div>
                </div>}
              </div>
            ))}

            {/* ── Kích thước ── */}
            <div className="idf-section">
              <div className="idf-section-title">Kích thước</div>
              <div className="size-row">
                <div className="size-input-wrap">
                  <div className="size-input-label">Ngang</div>
                  <input
                    type="text" inputMode="numeric" pattern="[0-9.,]*"
                    name="width" className="size-input"
                    placeholder="0"
                    value={form.width}
                    onChange={handleSizeInput}
                  />
                </div>
                <div className="size-sep">×</div>
                <div className="size-input-wrap">
                  <div className="size-input-label">Cao</div>
                  <input
                    type="text" inputMode="numeric" pattern="[0-9.,]*"
                    name="height" className="size-input"
                    placeholder="0"
                    value={form.height}
                    onChange={handleSizeInput}
                  />
                </div>
                <div className="size-unit">mm</div>
              </div>
            </div>

            {/* ── Ghi chú thêm ── */}
            <div className="idf-section">
              <div className="idf-section-title">Ghi chú thêm</div>
              <textarea
                className="form-textarea"
                placeholder="Nhập ghi chú thêm nếu có..."
                value={form.notes}
                onChange={e => setForm(prev => ({...prev, notes: e.target.value}))}
              />
            </div>

            {/* ── Nút lưu ── */}
            <div className="form-actions">
              <button
                className="btn btn-primary btn-full"
                onClick={handleSave}
                disabled={saving || saved}
              >
                {saved ? '✓ Đã lưu!' : saving ? '⏳ Đang lưu...' : '✓  Lưu thông tin'}
              </button>
              <button
                className="btn btn-secondary btn-full"
                onClick={onBack}
                disabled={saving}
              >
                Quay lại
              </button>
            </div>

          </div>
          {annEditorOpen && (
            <AnnotationEditor
              imageUrl={pendingPreview || image.imagePreviewUrl}
              initialAnnotations={annotations}
              onSave={function(anns){ setAnnotations(anns); setAnnEditorOpen(false); }}
              onCancel={function(){ setAnnEditorOpen(false); }}
            />
          )}
        </div>
      );
    }

    /* ─────────────────────────────────────────────
       PHOTO SECTION  (Prompt 5)
    ───────────────────────────────────────────── */
    /* --- Kiểm tra ảnh đã có thông tin chưa --- */
    function hasImageInfo(img) {
      return !!(
        (img.positions && img.positions.length > 0) || img.position ||
        img.area ||
        (img.curtainTypes && img.curtainTypes.length > 0) || img.curtainType ||
        (img.productSpecs && img.productSpecs.length > 0) || img.productSpec ||
        img.usageSpec ||
        (img.tags && img.tags.length > 0) || img.notes
      );
    }

    /* --- Tóm tắt size (luôn hiển thị mm) --- */
    function sizeLabel(img) {
      if (img.width && img.height) return `${img.width} × ${img.height} mm`;
      return null;
    }

    /* --- Thumbnail card với tóm tắt thông tin --- */
    function PhotoThumbCard({ img, idx, onSelect, onDelete, isSelectionMode, isSelected, onToggleSelect }) {
      const size         = sizeLabel(img);
      const isProduction = img.status === 'production';
      const statusLabel  = isProduction ? 'Sản xuất' : 'Khảo sát';

      // Backward compat: dùng mảng mới nếu có, fallback về field cũ
      const posArr     = (Array.isArray(img.positions)    && img.positions.length    > 0) ? img.positions    : (img.position    ? [img.position]    : []);
      const curtainArr = (Array.isArray(img.curtainTypes) && img.curtainTypes.length > 0) ? img.curtainTypes : (img.curtainType ? [img.curtainType] : []);
      const specArr    = (Array.isArray(img.productSpecs) && img.productSpecs.length > 0) ? img.productSpecs : (img.productSpec ? [img.productSpec]  : []);

      return (
        <div
          className={`photo-thumb-card${isSelected ? ' selected' : ''}`}
          data-image-id={img.imageId}
          onClick={() => { if (!isSelectionMode) onSelect(img.imageId); }}
          role="button"
          aria-label={isSelectionMode ? `${isSelected ? 'Bỏ chọn' : 'Chọn'} ảnh ${idx + 1}` : `Xem thông tin ảnh ${idx + 1}`}
          style={{cursor:'pointer'}}
        >
          {/* Badge STT — góc trên trái */}
          <span className="photo-thumb-stt">{idx + 1}</span>

          {/* Trạng thái chọn — góc trên phải (chỉ hiện khi chọn nhiều) */}
          {isSelectionMode && (
            isSelected
              ? <span className="photo-select-check">✓</span>
              : <span className="photo-select-ring"></span>
          )}

          {/* Ảnh */}
          <img
            src={img.imagePreviewUrl}
            alt={`Ảnh khảo sát ${idx + 1}`}
            className="photo-thumb-img"
            loading="lazy"
          />

          {/* Tóm tắt thông tin — bố cục cố định 7 dòng */}
          <div className="thumb-summary">

            {/* Dòng 1: Tình trạng */}
            <span className={`thumb-status-line${isProduction ? ' production' : ' survey'}`}>
              Tình trạng: <strong>{statusLabel}</strong>
            </span>

            {/* Dòng 2: vị trí */}
            <span className="thumb-info-line thumb-location">
              {posArr.length > 0
                ? posArr.join(' · ')
                : <span className="thumb-empty">—</span>}
            </span>

            {/* Dòng 3: loại rèm */}
            {curtainArr.length > 0 && (
              <span className="thumb-info-line thumb-spec">
                {curtainArr.join(' · ')}
              </span>
            )}

            {/* Dòng 4: quy cách sản phẩm */}
            {specArr.length > 0 && (
              <span className="thumb-info-line thumb-spec">
                {specArr.join(' · ')}
              </span>
            )}

            {/* Dòng lưu ý chips — chỉ hiện khi có tag */}
            {img.tags && img.tags.length > 0 && (
              <div className="thumb-tag-row">
                {img.tags.map(t => (
                  <span key={t} className="thumb-mini-chip warn">{t}</span>
                ))}
              </div>
            )}

            {/* Dòng 5: kích thước */}
            <span className={`thumb-size-text${!size ? ' empty' : ''}`}>
              {size || 'Chưa có kích thước'}
            </span>

            {/* Dòng 6: ghi chú (chỉ hiện nếu có) */}
            {img.notes && (
              <span className="thumb-notes-text">{joinLines(img.notes)}</span>
            )}

            {/* Dòng 7: ngày */}
            <span className="photo-thumb-date">{formatDate(img.updatedAt || img.createdAt)}</span>
          </div>
        </div>
      );
    }

    function PhotoSection({ projectId, onSelectImage, onExportSelected }) {
      const [images, setImages]               = useState([]);
      const [deletedImages, setDeletedImages] = useState([]);
      const [adding, setAdding]               = useState(false);
      const [errorMsg, setErrorMsg]           = useState(null);
      const [showDeleted, setShowDeleted]     = useState(false);
      const [confirmDelete, setConfirmDelete]         = useState(null); // imageId xóa mềm
      const [confirmPermDelete, setConfirmPermDelete] = useState(null); // imageId xóa vĩnh viễn
      const fileInputRef   = React.useRef(null);   // thư viện ảnh
      const cameraInputRef = React.useRef(null);   // camera
      const [showPhotoMenu, setShowPhotoMenu] = useState(false);
      // ── Chế độ chọn nhiều ảnh (Prompt 14.5) ──
      const [isSelectionMode, setIsSelectionMode] = useState(false);
      const [selectedImageIds, setSelectedImageIds] = useState([]);
      const [confirmBulkDelete, setConfirmBulkDelete] = useState(false);

      // Load ảnh active (isDeleted !== true)
      const loadImages = () => setImages(getImages(projectId));
      // Load ảnh đã xóa mềm
      const loadDeletedImages = () => setDeletedImages(getDeletedImages(projectId));

      useEffect(() => {
        loadImages();
        loadDeletedImages();
        const handler = () => { loadImages(); loadDeletedImages(); };
        window.addEventListener('imagesUpdated', handler);
        return () => window.removeEventListener('imagesUpdated', handler);
      }, [projectId]);

      // Mở menu chọn nguồn ảnh
      function handleAddClick() {
        setErrorMsg(null);
        setShowPhotoMenu(true);
      }

      // Chọn từ thư viện ảnh
      function handleLibraryClick() {
        setShowPhotoMenu(false);
        // Delay nhỏ để bottom sheet đóng trước khi mở picker
        setTimeout(() => { if (fileInputRef.current) fileInputRef.current.click(); }, 150);
      }

      // Chụp ảnh bằng camera
      function handleCameraClick() {
        setShowPhotoMenu(false);
        setTimeout(() => { if (cameraInputRef.current) cameraInputRef.current.click(); }, 150);
      }

      // Xử lý file được chọn
      async function handleFileChange(e) {
        const files = e.target.files;
        if (!files || files.length === 0) return;

        setAdding(true);
        setErrorMsg(null);

        const errors = [];
        let addedCount = 0;

        for (const file of Array.from(files)) {
          if (!file.type.startsWith('image/')) {
            errors.push(`"${file.name}" không phải file ảnh`);
            storageLog('ERROR', 'chi-tiết', 'handleFileChange()',
              `File không phải ảnh: ${file.name}`, `type: ${file.type}`);
            continue;
          }
          try {
            const dataUrl = await compressImage(file, 900, 0.72);
            addImage({ projectId, imagePreviewUrl: dataUrl });
            addedCount++;
          } catch (err) {
            if (err && err.type === 'QUOTA') {
              setErrorMsg(err.message);
              break;
            }
            errors.push(`Lỗi xử lý "${file.name}": ${err.message || 'Không xác định'}`);
            storageLog('ERROR', 'chi-tiết', 'handleFileChange()',
              `Lỗi nén/lưu ảnh: ${file.name}`, formatError(err));
          }
        }

        if (errors.length > 0 && !errorMsg) setErrorMsg(errors.join('; '));
        if (addedCount > 0) {
          window.dispatchEvent(new Event('imagesUpdated'));
          loadImages();
        }
        if (fileInputRef.current) fileInputRef.current.value = '';
        setAdding(false);
      }

      // ── XÓA MỀM: chỉ đánh isDeleted = true ──
      function handleSoftDeleteConfirmed(imageId) {
        try {
          softDeleteImage(imageId, projectId);
          window.dispatchEvent(new Event('imagesUpdated'));
          loadImages();
          loadDeletedImages();
        } catch (err) {
          storageLog('ERROR', 'chi-tiết', 'handleSoftDeleteConfirmed()',
            'Lỗi xóa mềm', formatError(err));
          setErrorMsg('Lỗi xóa ảnh. Vui lòng thử lại.');
        }
        setConfirmDelete(null);
      }

      // ── KHÔI PHỤC ──
      function handleRestore(imageId) {
        try {
          restoreImage(imageId, projectId);
          window.dispatchEvent(new Event('imagesUpdated'));
          loadImages();
          loadDeletedImages();
        } catch (err) {
          storageLog('ERROR', 'chi-tiết', 'handleRestore()',
            'Lỗi khôi phục', formatError(err));
          setErrorMsg('Lỗi khôi phục ảnh. Vui lòng thử lại.');
        }
      }

      // ── XÓA VĨNH VIỄN: remove hẳn object khỏi localStorage ──
      function handlePermDeleteConfirmed(imageId) {
        try {
          permanentDeleteImage(imageId);
          loadDeletedImages();
        } catch (err) {
          storageLog('ERROR', 'chi-tiết', 'handlePermDeleteConfirmed()',
            'Lỗi xóa vĩnh viễn', formatError(err));
          setErrorMsg('Lỗi xóa vĩnh viễn. Vui lòng thử lại.');
        }
        setConfirmPermDelete(null);
      }

      // ── Handlers chọn nhiều ảnh (Prompt 14.5) ──
      function enterSelectionMode() { setIsSelectionMode(true); setSelectedImageIds([]); }
      function exitSelectionMode()  { setIsSelectionMode(false); setSelectedImageIds([]); setConfirmBulkDelete(false); }
      function toggleSelect(imageId) {
        setSelectedImageIds(prev =>
          prev.includes(imageId) ? prev.filter(id => id !== imageId) : [...prev, imageId]
        );
      }
      function selectAll()   { setSelectedImageIds(images.map(img => img.imageId)); }
      function deselectAll() { setSelectedImageIds([]); }
      function handleBulkExport(type) {
        if (!selectedImageIds.length) return;
        onExportSelected && onExportSelected(type, selectedImageIds);
        exitSelectionMode();
      }
      function handleBulkDeleteConfirm() {
        const toDelete = [...selectedImageIds];
        toDelete.forEach(id => {
          try { softDeleteImage(id, projectId); }
          catch (err) { storageLog('ERROR', 'chi-tiết', 'handleBulkDeleteConfirm()', 'Lỗi xóa mềm hàng loạt', formatError(err)); }
        });
        window.dispatchEvent(new Event('imagesUpdated'));
        loadImages();
        loadDeletedImages();
        exitSelectionMode();
      }

      // ── Chọn ảnh bằng trượt tay (Prompt 14.7) ──
      const dragSelectRef = React.useRef({ ready: false, active: false, startX: 0, startY: 0, startImageId: null, addedIds: new Set() });

      function handleGridPointerDown(e) {
        if (!isSelectionMode) return;
        const card = e.target.closest('[data-image-id]');
        if (!card) return;
        e.preventDefault();
        dragSelectRef.current = {
          ready: true, active: false,
          startX: e.clientX, startY: e.clientY,
          startImageId: card.dataset.imageId,
          addedIds: new Set([card.dataset.imageId]),
        };
      }

      function handleGridPointerMove(e) {
        if (!isSelectionMode || !dragSelectRef.current.ready) return;
        const dx = e.clientX - dragSelectRef.current.startX;
        const dy = e.clientY - dragSelectRef.current.startY;
        if (!dragSelectRef.current.active && Math.hypot(dx, dy) > 8) {
          dragSelectRef.current.active = true;
          const sid = dragSelectRef.current.startImageId;
          setSelectedImageIds(prev => prev.includes(sid) ? prev : [...prev, sid]);
        }
        if (!dragSelectRef.current.active) return;
        const el = document.elementFromPoint(e.clientX, e.clientY);
        if (!el) return;
        const card = el.closest('[data-image-id]');
        if (!card) return;
        const imageId = card.dataset.imageId;
        if (dragSelectRef.current.addedIds.has(imageId)) return;
        dragSelectRef.current.addedIds.add(imageId);
        setSelectedImageIds(prev => prev.includes(imageId) ? prev : [...prev, imageId]);
      }

      function handleGridPointerUp(e) {
        if (!isSelectionMode) return;
        const { ready, active, startImageId } = dragSelectRef.current;
        if (ready && !active && startImageId) {
          toggleSelect(startImageId);
        }
        dragSelectRef.current = { ready: false, active: false, startX: 0, startY: 0, startImageId: null, addedIds: new Set() };
      }

            const imgCount     = images.length;
      const deletedCount = deletedImages.length;

      return (
        <>
        {/* ── Bottom sheet: chọn nguồn ảnh ── */}
        {showPhotoMenu && (
          <div className="photo-menu-overlay" onClick={() => setShowPhotoMenu(false)}>
            <div className="photo-menu-sheet" onClick={e => e.stopPropagation()}>
              <div className="photo-menu-handle"></div>
              <div className="photo-menu-title">Thêm ảnh khảo sát</div>
              <button className="photo-menu-btn" onClick={handleLibraryClick}>
                Chọn từ thư viện ảnh
              </button>
              <button className="photo-menu-btn" onClick={handleCameraClick}>
                Chụp ảnh bằng camera
              </button>
              <button className="photo-menu-cancel" onClick={() => setShowPhotoMenu(false)}>
                Hủy
              </button>
            </div>
          </div>
        )}

        <div className="photo-section">
          {/* Header — chỉ hiện khi có ảnh */}
          {(imgCount > 0 || isSelectionMode) && (
            <div className="photo-section-header" style={{justifyContent:'flex-end'}}>
              <div style={{display:'flex', gap:6, alignItems:'center'}}>
                {!isSelectionMode && (
                  <button className="btn-add-photo-sm" onClick={handleAddClick} disabled={adding}>
                    <span>＋</span> Thêm ảnh
                  </button>
                )}
                <button
                  className={`btn-select-mode${isSelectionMode ? ' active' : ''}`}
                  onClick={isSelectionMode ? exitSelectionMode : enterSelectionMode}
                >
                  {isSelectionMode ? 'Hủy chọn' : 'Chọn ảnh'}
                </button>
              </div>
            </div>
          )}


          {/* Nút "Ảnh đã xóa" — nhẹ nhàng, trung tính */}
          <div className="photo-deleted-row">
            <button
              className="btn-show-deleted"
              onClick={() => setShowDeleted(v => !v)}
            >
              
              <span className="deleted-label">
                Ảnh đã xóa ({deletedCount})
              </span>
              <span style={{fontSize:'10px', opacity:0.5}}>
                {showDeleted ? '▲' : '▼'}
              </span>
            </button>
          </div>

          {/* Panel ảnh đã xóa */}
          {showDeleted && (
            <div className="deleted-panel">
              <div className="deleted-panel-title">Ảnh đã xóa — {deletedCount} ảnh</div>

              {deletedCount === 0 ? (
                <div className="deleted-empty">Chưa có ảnh đã xóa</div>
              ) : (
                deletedImages.map(img => {
                  const dSize = (img.width && img.height) ? `${img.width} × ${img.height} mm` : null;
                  const hasTags = !!(img.position || img.area || img.curtainType ||
                                     img.productSpec || img.usageSpec ||
                                     (img.tags && img.tags.length > 0));
                  return (
                    <div key={img.imageId} className="deleted-card">
                      <img src={img.imagePreviewUrl} alt="Ảnh đã xóa" className="deleted-thumb" />
                      <div className="deleted-info">
                        <div className="deleted-date">
                          Đã xóa: {formatDate(img.deletedAt || img.updatedAt)}
                        </div>
                        {hasTags && (
                          <div className="deleted-tags">
                            {img.position    && <span className="deleted-mini-chip">{img.position}</span>}
                            {img.area        && <span className="deleted-mini-chip">{img.area}</span>}
                            {img.curtainType && <span className="deleted-mini-chip">{img.curtainType}</span>}
                            {img.productSpec && <span className="deleted-mini-chip">{img.productSpec}</span>}
                            {img.usageSpec   && <span className="deleted-mini-chip">{img.usageSpec}</span>}
                            {img.tags && img.tags.map(t => (
                              <span key={t} className="deleted-mini-chip">{t}</span>
                            ))}
                          </div>
                        )}
                        {dSize && <div className="deleted-size-text">{dSize}</div>}
                        <div className="deleted-actions">
                          <button className="btn-restore"
                            onClick={() => handleRestore(img.imageId)}>
                            ↩ Khôi phục
                          </button>
                          <button className="btn-perm-delete"
                            onClick={() => setConfirmPermDelete(img.imageId)}>
                            Xóa vĩnh viễn
                          </button>
                        </div>
                      </div>
                    </div>
                  );
                })
              )}
            </div>
          )}

          {/* Input file ẩn: thư viện ảnh (không có capture — để người dùng chọn album) */}
          <input
            ref={fileInputRef}
            type="file"
            accept="image/*"
            multiple
            style={{ display: 'none' }}
            onChange={handleFileChange}
          />
          {/* Input file ẩn: camera (capture=environment mở camera sau) */}
          <input
            ref={cameraInputRef}
            type="file"
            accept="image/*"
            capture="environment"
            style={{ display: 'none' }}
            onChange={handleFileChange}
          />

          {/* Thông báo lỗi */}
          {errorMsg && (
            <div className="alert alert-warning" style={{margin:'10px 12px 0'}}>
              <span className="alert-icon">⚠️</span>
              <span>{errorMsg}</span>
              <button style={{marginLeft:'auto',background:'none',border:'none',cursor:'pointer',fontSize:'14px'}}
                onClick={() => setErrorMsg(null)}>✕</button>
            </div>
          )}

          {/* Đang xử lý */}
          {adding && (
            <div className="photo-adding-indicator">
              <span className="spinner"></span>
              Đang xử lý ảnh...
            </div>
          )}

          {/* Empty state */}
          {!adding && imgCount === 0 && (
            <>
              <div className="photo-empty">
                <div className="photo-empty-icon"></div>
                <div className="photo-empty-title">Chưa có ảnh khảo sát nào</div>
                <div className="photo-empty-desc">
                  Bấm nút bên dưới để thêm ảnh.<br/>
                  Mỗi ảnh sẽ kèm thông tin vị trí, khu vực và loại rèm ở bước tiếp theo.
                </div>
              </div>
              <button className="btn-add-photo-lg" onClick={handleAddClick}>
                <span style={{fontSize:'20px'}}>＋</span>
                Thêm ảnh khảo sát
              </button>
            </>
          )}

          {/* Grid thumbnail ảnh active */}
          {imgCount > 0 && (
            <div
              className="photo-grid"
              data-selecting={isSelectionMode ? "true" : undefined}
              onPointerDown={handleGridPointerDown}
              onPointerMove={handleGridPointerMove}
              onPointerUp={handleGridPointerUp}
              onPointerCancel={handleGridPointerUp}
              style={isSelectionMode ? {touchAction:'none'} : undefined}
            >
              {images.map((img, idx) => (
                <PhotoThumbCard
                  key={img.imageId}
                  img={img}
                  idx={idx}
                  onSelect={imageId => onSelectImage && onSelectImage(imageId)}
                  onDelete={imageId => setConfirmDelete(imageId)}
                  isSelectionMode={isSelectionMode}
                  isSelected={selectedImageIds.includes(img.imageId)}
                  onToggleSelect={toggleSelect}
                />
              ))}
            </div>
          )}

          {/* ── Modal xác nhận XÓA MỀM ── */}
          {confirmDelete && (
            <div className="modal-overlay" onClick={() => setConfirmDelete(null)}>
              <div className="modal-box" onClick={e => e.stopPropagation()}>
                
                <div className="modal-title">Xóa ảnh này?</div>
                <div className="modal-desc">
                  Ảnh sẽ được chuyển vào mục Ảnh đã xóa và có thể khôi phục.
                </div>
                <div className="modal-btns">
                  <button className="btn btn-secondary btn-full" style={{flex:1}}
                    onClick={() => setConfirmDelete(null)}>
                    Giữ lại
                  </button>
                  <button className="btn btn-danger btn-full" style={{flex:1}}
                    onClick={() => handleSoftDeleteConfirmed(confirmDelete)}>
                    Chuyển vào ảnh đã xóa
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* ── Modal xác nhận XÓA VĨNH VIỄN ── */}
          {confirmPermDelete && (
            <div className="modal-overlay" onClick={() => setConfirmPermDelete(null)}>
              <div className="modal-box" onClick={e => e.stopPropagation()}>
                <div className="modal-icon">⚠️</div>
                <div className="modal-title">Xóa vĩnh viễn ảnh này?</div>
                <div className="modal-desc">
                  Ảnh sẽ bị xóa hoàn toàn khỏi bộ nhớ và không thể khôi phục.
                </div>
                <div className="modal-btns">
                  <button className="btn btn-secondary btn-full" style={{flex:1}}
                    onClick={() => setConfirmPermDelete(null)}>
                    Hủy
                  </button>
                  <button className="btn btn-danger btn-full" style={{flex:1}}
                    onClick={() => handlePermDeleteConfirmed(confirmPermDelete)}>
                    Xóa vĩnh viễn
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* ── Spacer tránh content bị action bar che (Prompt 14.5) ── */}
          {isSelectionMode && <div className="selection-bar-spacer" />}
        </div>

        {/* ── Action bar chế độ chọn nhiều ảnh ── */}
        {isSelectionMode && (
          <div className="selection-action-bar">
            <div className="selection-action-row">
              <button className="btn-sel pdf"
                disabled={selectedImageIds.length === 0}
                onClick={() => handleBulkExport('pdf')}>
                In PDF
              </button>
              <button className="btn-sel zip"
                disabled={selectedImageIds.length === 0}
                onClick={() => handleBulkExport('individual')}>
                Xuất ảnh
              </button>
              <button className="btn-sel del"
                disabled={selectedImageIds.length === 0}
                onClick={() => setConfirmBulkDelete(true)}>
                Xóa
              </button>
            </div>
          </div>
        )}

        {/* ── Modal xác nhận XÓA NHIỀU ẢNH (Prompt 14.5) ── */}
        {confirmBulkDelete && (
          <div className="modal-overlay" onClick={() => setConfirmBulkDelete(false)}>
            <div className="modal-box" onClick={e => e.stopPropagation()}>
              
              <div className="modal-title">Xóa ảnh đã chọn?</div>
              <div className="modal-desc">
                Bạn đang chọn <strong>{selectedImageIds.length} ảnh</strong>.
                Ảnh sẽ được chuyển vào mục Ảnh đã xóa và có thể khôi phục nếu cần.
              </div>
              <div className="modal-btns">
                <button className="btn btn-secondary btn-full" style={{flex:1}}
                  onClick={() => setConfirmBulkDelete(false)}>
                  Hủy
                </button>
                <button className="btn btn-danger btn-full" style={{flex:1}}
                  onClick={handleBulkDeleteConfirm}>
                  Chuyển vào ảnh đã xóa
                </button>
              </div>
            </div>
          </div>
        )}
        </>
      );
    }

    /* ─────────────────────────────────────────────
       SHARE RESULT MODAL  (Prompt 14.1)
       Hiển thị sau khi xuất file xong:
         - Nút Tải file (download link)
         - Nút Chia sẻ file (Web Share API nếu thiết bị hỗ trợ)
         - Fallback: hướng dẫn văn bản nếu không hỗ trợ
    ───────────────────────────────────────────── */
    function ShareResultModal({ result, projectName, onClose }) {
      const [shareError, setShareError] = React.useState('');

      // Kiểm tra Web Share API có hỗ trợ chia sẻ file không
      const canShareFiles = React.useMemo(() => {
        if (!navigator.canShare || !result.blob) return false;
        try {
          const testFile = new File([result.blob], result.filename, { type: result.mimeType });
          return navigator.canShare({ files: [testFile] });
        } catch { return false; }
      }, [result]);

      function handleDownload() {
        const url = URL.createObjectURL(result.blob);
        const a   = document.createElement('a');
        a.href = url; a.download = result.filename;
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(url), 4000);
      }

      async function handleShare() {
        setShareError('');
        try {
          const file = new File([result.blob], result.filename, { type: result.mimeType });
          await navigator.share({
            files:  [file],
            title:  projectName || 'MrCurtain Survey',
          });
        } catch (err) {
          if (err.name !== 'AbortError') {
            setShareError('Không chia sẻ được. Vui lòng tải file xuống và gửi thủ công.');
            storageLog('WARN', 'chi-tiet', 'ShareResultModal handleShare()',
              'Loi Web Share API', formatError(err));
          }
        }
      }

      return (
        <div className="modal-overlay" onClick={onClose}>
          <div className="modal-box" onClick={e => e.stopPropagation()}>
            
            <div className="modal-title" style={{textAlign:'center'}}>Xuất file thành công!</div>
            <div style={{
              fontSize:12, color:'var(--text-secondary)', textAlign:'center',
              margin:'4px 0 0', wordBreak:'break-all', lineHeight:1.5
            }}>
              {result.filename}
            </div>
            <div className="share-result-actions">
              <button className="btn btn-primary btn-full" onClick={handleDownload}>
                Tải file xuống
              </button>
              {canShareFiles ? (
                <button className="btn btn-secondary btn-full" onClick={handleShare}>
                  Chia sẻ qua Zalo / ứng dụng khác
                </button>
              ) : (
                <div className="share-fallback-tip">
                  Thiết bị chưa hỗ trợ chia sẻ file trực tiếp.<br/>
                  Nhấn <strong>Tải file xuống</strong> trước, sau đó mở file và gửi qua Zalo.
                </div>
              )}
              {shareError && (
                <div className="share-fallback-tip" style={{background:'#fef2f2', borderColor:'#fca5a5', color:'#7f1d1d'}}>
                  ⚠️ {shareError}
                </div>
              )}
              <button className="btn btn-secondary btn-full" onClick={onClose}>
                Đóng
              </button>
            </div>
          </div>
        </div>
      );
    }

    /* ─────────────────────────────────────────────
       PROJECT DETAIL SCREEN
    ───────────────────────────────────────────── */
    /* ─────────────────────────────────────────────
       EXPORT MODAL  (Prompt 12)
    ───────────────────────────────────────────── */
    /* ─── ExportModal ────────────────────────────────────────────────────────
       Bước 1: Chọn loại xuất  (PDF / ảnh báo cáo / từng ảnh)
       Bước 2: Chọn kiểu dàn trang  (chỉ PDF & ảnh báo cáo)
       Bước 3: Chọn ảnh cần xuất    (chỉ từng ảnh — all / custom STT)
    ─────────────────────────────────────────────────────────────────────── */
    function ExportModal({ onExport, onClose, exporting, imageCount }) {
      const [step,       setStep]      = React.useState('type');
      const [selType,    setSelType]   = React.useState(null);
      const [indivMode,  setIndivMode] = React.useState('all');    // 'all' | 'custom'
      const [sttInput,   setSttInput]  = React.useState('');
      const [sttError,   setSttError]  = React.useState('');

      const statusMap = {
        'pdf-single':    'Đang tạo PDF (1 trang)...',
        'pdf-multi':     'Đang tạo PDF (nhiều trang)...',
        'image-single':  'Đang tạo ảnh báo cáo...',
        'image-multi':   'Đang tạo ảnh báo cáo...',
        'individual-zip':'Đang chuẩn bị file ZIP...',
      };

      /* ── Loading overlay — fallback hiển thị chuỗi progress ── */
      if (exporting) {
        return (
          <div className="modal-overlay">
            <div className="modal-box" style={{textAlign:'center'}}>
              <div style={{fontSize:32, marginBottom:10}}>⏳</div>
              <div style={{fontSize:14, fontWeight:600}}>
                {statusMap[exporting] || exporting || 'Đang xử lý...'}
              </div>
              <div style={{fontSize:12, color:'var(--text-secondary)', marginTop:5}}>
                Vui lòng chờ, không tắt ứng dụng
              </div>
            </div>
          </div>
        );
      }

      /* ── Bước 1: Chọn loại file ── */
      if (step === 'type') {
        return (
          <div className="modal-overlay" onClick={onClose}>
            <div className="modal-box" onClick={e => e.stopPropagation()}>
              <div className="modal-title" style={{marginBottom:14}}>Chọn kiểu xuất báo cáo</div>
              <div style={{display:'flex', flexDirection:'column', gap:9}}>
                <button className="export-choice-btn pdf"
                  onClick={() => { setSelType('pdf'); setStep('layout'); }}>
                  <div>
                    <div style={{fontWeight:700}}>Xuất PDF</div>
                    <div style={{fontSize:11, opacity:0.75}}>File .pdf — in hoặc gửi được</div>
                  </div>
                </button>
                <button className="export-choice-btn image"
                  onClick={() => { setSelType('image'); setStep('layout'); }}>
                  <div>
                    <div style={{fontWeight:700}}>Xuất ảnh báo cáo</div>
                    <div style={{fontSize:11, opacity:0.75}}>File .png — dễ chia sẻ qua Zalo/chat</div>
                  </div>
                </button>
                <button className="export-choice-btn each"
                  onClick={() => { setIndivMode('all'); setSttInput(''); setSttError(''); setStep('individual-select'); }}>
                  <div>
                    <div style={{fontWeight:700}}>Xuất từng ảnh khảo sát</div>
                    <div style={{fontSize:11, opacity:0.75}}>Mỗi ảnh kèm thông tin — gom vào file ZIP</div>
                  </div>
                </button>
                <button className="btn btn-secondary" onClick={onClose} style={{marginTop:3}}>Hủy</button>
              </div>
            </div>
          </div>
        );
      }

      /* ── Bước 2: Chọn kiểu dàn trang (PDF / ảnh báo cáo) ── */
      if (step === 'layout') {
        const manyImages = (imageCount || 0) > 5;
        const typeLabel  = selType === 'pdf' ? 'PDF' : 'ảnh báo cáo';
        return (
          <div className="modal-overlay" onClick={onClose}>
            <div className="modal-box" onClick={e => e.stopPropagation()}>
              <div className="modal-title" style={{marginBottom:4}}>Chọn kiểu dàn trang</div>
              <div style={{fontSize:12, color:'var(--text-secondary)', marginBottom:14}}>
                Xuất {typeLabel}
              </div>
              <div style={{display:'flex', flexDirection:'column', gap:9}}>
                <button className="export-choice-btn"
                  style={{background:'var(--primary-light)', border:'1.5px solid var(--border)'}}
                  onClick={() => onExport(selType, 'single', null)}>
                  <div>
                    <div style={{fontWeight:700}}>In trong 1 trang</div>
                    <div style={{fontSize:11, opacity:0.75}}>Toàn bộ nội dung gọn trong 1 khung</div>
                  </div>
                </button>
                <button className="export-choice-btn"
                  style={{background:'var(--primary-light)', border:'1.5px solid var(--primary)'}}
                  onClick={() => onExport(selType, 'multi', null)}>
                  <div>
                    <div style={{fontWeight:700}}>Dàn sang nhiều trang</div>
                    <div style={{fontSize:11, opacity:0.75}}>Mỗi card ảnh liền mạch, không bị cắt trang</div>
                  </div>
                </button>
                {manyImages && (
                  <div style={{background:'#fefce8', border:'1px solid #fde047', borderRadius:6,
                    padding:'7px 10px', fontSize:11, color:'#713f12', lineHeight:1.5}}>
                    ⚠️ Công trình có nhiều ảnh. Nên chọn <strong>Dàn sang nhiều trang</strong>.
                  </div>
                )}
              </div>
              <button className="btn btn-secondary btn-full" style={{marginTop:12}}
                onClick={() => setStep('type')}>← Quay lại</button>
            </div>
          </div>
        );
      }

      /* ── Bước 3: Chọn ảnh cần xuất (individual) ── */
      function handleExportIndividual() {
        if (indivMode === 'all') {
          onExport('individual', null, { mode: 'all', stts: null });
          return;
        }
        /* Parse STT */
        const raw = sttInput.trim();
        if (!raw) { setSttError('Vui lòng nhập STT ảnh cần xuất.'); return; }
        const parts = raw.split(',');
        const parsed = [];
        for (const p of parts) {
          const n = parseInt(p.trim(), 10);
          if (isNaN(n) || n <= 0 || String(n) !== p.trim()) {
            setSttError('Danh sách STT không hợp lệ. Vui lòng nhập dạng 1,2,3 hoặc 1,3,4,5.');

          if (n > (imageCount || 0)) {
            setSttError('Ảnh số ' + n + ' không tồn tại trong danh sách ảnh hiện tại.');
            return;
          }
          if (!parsed.includes(n)) parsed.push(n);
        }
        if (parsed.length === 0) { setSttError('Vui lòng nhập ít nhất 1 STT hợp lệ.'); return; }
        onExport('individual', null, { mode: 'custom', stts: parsed });
      }

    function ProjectDetail({ projectId, onBack, onSelectImage, onOpenTagManager }) {

      const [infoExpanded, setInfoExpanded]      = useState(false);  // Prompt 14.1

        }
      };

      useEffect(() => {
